function supabaseEnabled() {

async function supabaseInsert(table, payload) {
  if (!supabaseEnabled()) return;
  try {
    await fetch(`${SUPABASE_CONFIG.url}/rest/v1/${table}`, {
      method: "POST",
      headers: {
        apikey: SUPABASE_CONFIG.anonKey,
        Authorization: `Bearer ${SUPABASE_CONFIG.anonKey}`,
        "Content-Type": "application/json",
        Prefer: "return=minimal",
      },
      body: JSON.stringify(payload),
    });
  } catch (error) {
    console.warn("Supabase offline ou sem permissão:", error);
  }
}

async function supabaseUpsert(table, payload, conflictColumns) {
  if (!supabaseEnabled()) return;
  try {
    await fetch(`${SUPABASE_CONFIG.url}/rest/v1/${table}?on_conflict=${conflictColumns}`, {
      method: "POST",
      headers: {
        apikey: SUPABASE_CONFIG.anonKey,
        Authorization: `Bearer ${SUPABASE_CONFIG.anonKey}`,
        "Content-Type": "application/json",
        Prefer: "resolution=merge-duplicates,return=minimal",
      },
      body: JSON.stringify(payload),
    });
  } catch (error) {
    console.warn("Supabase offline ou sem permissão:", error);
  }
}

function numberValue(value) {
  const parsed = Number(String(value || "").replace(",", "."));
  return Number.isFinite(parsed) ? parsed : 0;
}

function formatNumber(value, decimals = 0) {
  return numberValue(value).toLocaleString("pt-BR", {
    minimumFractionDigits: decimals,
    maximumFractionDigits: decimals,
  });
}

function formatCurrency(value) {
  return numberValue(value).toLocaleString("pt-BR", {
    style: "currency",
    currency: "BRL",
  });
}

function formatPercent(value) {
  return value ? `${formatNumber(value * 100, 1)}%` : "";
}

function average(rows, selector) {
  const values = rows.map(selector).map(numberValue).filter((value) => value !== 0);
  return values.length ? values.reduce((sum, value) => sum + value, 0) / values.length : 0;
}

function formatDate(value) {
  if (!value) return "";
  const [year, month, day] = value.split("-");
  return `${day}/${month}/${year}`;
}

function getDateParts(value) {
  if (!value) return { diaSemana: "", semana: "", mes: "" };
  const date = new Date(`${value}T12:00:00`);
  const diaSemana = date.toLocaleDateString("pt-BR", { weekday: "short" }).replace(".", "").toUpperCase();
  const mes = date.toLocaleDateString("pt-BR", { month: "short" }).replace(".", "").toUpperCase();
  const day = date.getDate();
  const weekend = date.getDay() === 0 || date.getDay() === 6;
  const semana = weekend ? "" : `Semana ${Math.floor((day - 1) / 7) + 1}`;
  return { diaSemana, semana, mes };
}

function calculateMlsEfetiva(milesimo) {
  const mls = numberValue(milesimo);
  return mls ? (mls * 0.75) + 0.25 : 0;
}

function calculateCommon(row, { total }) {
  const colaboradores = numberValue(row.colaboradores);
  const meta = numberValue(row.meta);
  const custoMdoDia = numberValue(row.custoMdoDia);
  const custoDiaTrabalhado = custoMdoDia * colaboradores;
  return {
    ...row,
    ...getDateParts(row.data),
    producaoColaborador: colaboradores ? total / colaboradores : 0,
    percentualMeta: meta ? total / meta : 0,
    producaoHora: colaboradores ? total / (colaboradores * 7) : 0,
    custoDiaTrabalhado,
    custoProducao: total ? custoDiaTrabalhado / total : 0,
  };
}

function calculatedRows(processId = coState.activeProcessId) {
  const config = configFor(processId);
  if (!config) return [];
  const sourceRows = coState.rows[processId] || [];
  const cache = coState.calculatedCache[processId];
  if (cache && cache.sourceRows === sourceRows && cache.length === sourceRows.length) return cache.rows;
  const rows = sourceRows
    .map((row) => config.calculate(row))
    .sort((a, b) => {
      if (!a.data && b.data) return 1;
      if (a.data && !b.data) return -1;
      return (a.data || "").localeCompare(b.data || "");
    });
  coState.calculatedCache[processId] = { sourceRows, length: sourceRows.length, rows };
  return rows;
}

  if (column.percent) return formatPercent(row[column.key]);
  if (column.currency) return row[column.key] ? formatCurrency(row[column.key]) : "";
  if (column.numeric) return row[column.key] ? formatNumber(row[column.key], column.decimals || 0) : "";
  return row[column.key] || "";
}

function renderTable(config) {
  const term = searchInput.value.trim().toLowerCase();
  const rows = calculatedRows(config.id).filter((row) => JSON.stringify(row).toLowerCase().includes(term));
  document.querySelector("#tableBody").innerHTML = rows.length ? rows.map((row) => `
    <tr>${config.columns.map((column) => `<td>${formatCell(row, column)}</td>`).join("")}</tr>
  `).join("") : `<tr><td class="empty-state" colspan="${config.columns.length}">Nenhum lançamento em ${config.name}.</td></tr>`;
}

function renderSummary(config) {
  const rows = calculatedRows(config.id);
  const total = rows.reduce((sum, row) => sum + numberValue(row[config.totalKey]), 0);
  const avgCollaborators = rows.length ? rows.reduce((sum, row) => sum + numberValue(row.colaboradores), 0) / rows.length : 0;
  const avgPerPerson = rows.length ? rows.reduce((sum, row) => sum + row.producaoColaborador, 0) / rows.length : 0;
  const avgProductionHour = average(rows, (row) => row.producaoHora || row.gramasHora || row.produtividadeHoraHomem);
  const avgMdoDay = average(rows, (row) => row.custoMdoDia || row.mediaCustoMdoDia);
  const avgWorkedDayCost = average(rows, (row) => row.custoDiaTrabalhado || row.mediaCustoMdoDia);
  const avgCostProduction = average(rows, (row) => row.custoProducao || row.custoGrama);
  document.querySelector("#kpiTotalLabel").textContent = config.totalLabel;
  document.querySelector("#kpiCollaboratorsLabel").textContent = "Média colaborador";
  document.querySelector("#kpiPerPersonLabel").textContent = "Média produção p/ colaborador";
  document.querySelector("#kpiProductionHourLabel").textContent = "Média produção/h";
  document.querySelector("#kpiMdoDayLabel").textContent = "Média custo MDO/dia";
  document.querySelector("#kpiWorkedDayCostLabel").textContent = "Média custo dia/trabalhado";
  document.querySelector("#kpiCostProductionLabel").textContent = "Média custo/produção";
  document.querySelector("#kpiTotal").textContent = formatNumber(total);
  document.querySelector("#kpiCollaborators").textContent = formatNumber(avgCollaborators, 1);
  document.querySelector("#kpiPerPerson").textContent = formatNumber(avgPerPerson, 1);
  document.querySelector("#kpiProductionHour").textContent = formatNumber(avgProductionHour, 1);
  document.querySelector("#kpiMdoDay").textContent = formatCurrency(avgMdoDay);
  document.querySelector("#kpiWorkedDayCost").textContent = formatCurrency(avgWorkedDayCost);
  document.querySelector("#kpiCostProduction").textContent = avgCostProduction ? formatCurrency(avgCostProduction) : "R$ 0,00";
}

function renderProcess() {
  const config = configFor();
  if (!config) return;
  document.querySelector("#tableTitle").textContent = config.sheetName;
  renderTableHeader(config);
  renderSummary(config);
  renderTable(config);
}

function implementedConfigs() {
  return Object.values(PROCESS_CONFIGS);
}

function dashboardRows(config) {
  const period = document.querySelector("#dashboardPeriod")?.value || "all";
  const sector = document.querySelector("#dashboardSector")?.value || "all";
  if (sector !== "all" && config.id !== sector) return [];
  return calculatedRows(config.id).filter((row) => {
    if (period === "all") return true;
    return row.data && row.data.startsWith(period);
  });
}

function getRowTotal(row, config) {
  return numberValue(row[config.totalKey]);
}

function getRowPiecesTotal(row, config) {
  if (config.id === "galvanoplastia") return numberValue(row.qtdPecas);
  if (config.id === "etiquetagem") return numberValue(row.qtdPecas);
  if (config.id === "colagem") return numberValue(row.qtdPecas || row.tagsCampinas || row.tagsPreco);
  return getRowTotal(row, config);
}

function dashboardMetricUnit(config) {
  if (config.id === "galvanoplastia") return "Kg";
  if (config.id === "etiquetagem" || config.id === "colagem") return "Tags";
  return "Peças";
}

function selectedDashboardPeriod() {
  const period = document.querySelector("#dashboardPeriod")?.value || "all";
  if (period !== "all") return period;
  const periods = availableDashboardPeriods();
  return periods.length ? periods[periods.length - 1][0] : null;
}

function dashboardMonthTotal(config, monthKey, selector) {
  const cacheKey = `${config.id}|${monthKey}|${selector.name || "selector"}`;
  if (coState.monthTotalCache[cacheKey] !== undefined) return coState.monthTotalCache[cacheKey];
  const total = calculatedRows(config.id)
    .filter((row) => row.data && row.data.startsWith(monthKey))
    .reduce((sum, row) => sum + selector(row, config), 0);
  coState.monthTotalCache[cacheKey] = total;
  return total;
}

function periodRows(config, period = selectedDashboardPeriod()) {
  return calculatedRows(config.id).filter((row) => !period || (row.data && row.data.startsWith(period)));
}

function dashboardYearMonths(period) {
  const year = period ? period.slice(0, 4) : String(new Date().getFullYear());
  return MONTHS.map(([month, label]) => ({ key: `${year}-${month}`, label }));
}

function projectedNextMonth(config, period, selector) {
  if (!period) return 0;
  const [year, month] = period.split("-").map(Number);
  const monthKeys = [1, 2, 3].map((offset) => {
    const date = new Date(year, month - 1 - offset, 1);
    return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, "0")}`;
  });
  const values = monthKeys
    .map((monthKey) => dashboardMonthTotal(config, monthKey, selector))
    .filter((value) => value > 0);
  return values.length ? values.reduce((sum, value) => sum + value, 0) / values.length : dashboardMonthTotal(config, period, selector);
}

function getRowCost(row) {
  return numberValue(row.custoTotalMdo || row.custoDiaTrabalhado || row.mediaCustoMdoDia);
}

function getRowPeople(row) {
  return numberValue(row.colaboradores);
}

function getRowProductivity(row) {
  return numberValue(row.producaoHora || row.gramasHora || row.produtividadeHoraHomem);
}

function dashboardSectorMetrics() {
  return implementedConfigs().map((config) => {
    const rows = dashboardRows(config);
    const total = rows.reduce((sum, row) => sum + getRowTotal(row, config), 0);
    const cost = rows.reduce((sum, row) => sum + getRowCost(row), 0);
    const productivity = average(rows, getRowProductivity);
    const costPerProduction = total ? cost / total : 0;
    return { config, rows, total, cost, productivity, costPerProduction };
  }).filter((item) => item.rows.length);
}

function availableDashboardPeriods() {
  const months = new Map();
  implementedConfigs().forEach((config) => {
    calculatedRows(config.id).forEach((row) => {
      if (!row.data) return;
      const key = row.data.slice(0, 7);
      months.set(key, monthLabel(key));
    });
  });
  return [...months.entries()].sort(([a], [b]) => a.localeCompare(b));
}

function monthLabel(monthKey) {
  const [year, month] = monthKey.split("-");
  const date = new Date(Number(year), Number(month) - 1, 1);
  return date.toLocaleDateString("pt-BR", { month: "short", year: "numeric" }).replace(".", "");
}

function renderDashboardPeriodOptions() {
  const select = document.querySelector("#dashboardPeriod");
  if (!select) return;
  const current = select.value || "all";
  const options = availableDashboardPeriods().map(([value, label]) => `<option value="${value}">${label}</option>`).join("");
  select.innerHTML = `<option value="all">Todos os meses</option>${options}`;
  select.value = [...select.options].some((option) => option.value === current) ? current : "all";
}

function renderDashboardSectorOptions() {
  const select = document.querySelector("#dashboardSector");
  if (!select) return;
  const current = select.value || "all";
  select.innerHTML = `<option value="all">Todos os setores</option>${implementedConfigs().map((config) => `<option value="${config.id}">${config.name}</option>`).join("")}`;
  select.value = [...select.options].some((option) => option.value === current) ? current : "all";
}

function renderDashboard() {
  renderDashboardPeriodOptions();
  renderDashboardSectorOptions();
  const metrics = dashboardSectorMetrics();
  const totalProduction = metrics.reduce((sum, item) => sum + item.total, 0);
  const totalCost = metrics.reduce((sum, item) => sum + item.cost, 0);
  const avgCost = totalProduction ? totalCost / totalProduction : 0;
  const deltas = dashboardDeltas({ totalProduction, totalCost, avgProductivity: 0, avgCost });
  document.querySelector("#dashTotalProduction").textContent = formatNumber(totalProduction);
  document.querySelector("#dashTotalCost").textContent = formatCurrency(totalCost);
  document.querySelector("#dashAvgCost").textContent = formatCurrency(avgCost);
  document.querySelector("#dashTotalProductionDelta").textContent = formatDelta(deltas.totalProduction, false);
  document.querySelector("#dashTotalCostDelta").textContent = formatDelta(deltas.totalCost, false);
  document.querySelector("#dashAvgCostDelta").textContent = formatDelta(deltas.avgCost, false);
  renderDashboardSectorBars(metrics, totalProduction);
  renderDashboardRanking(metrics);
  renderDashboardMix(metrics, totalProduction);
  renderDashboardMonthlyChart();
  renderDashboardConsolidated();
  renderVisualManagement(metrics);
  renderDashboardSummaryTable(metrics, totalProduction);
}

function previousMonth(period) {
  if (!period || period === "all") return null;
  const [year, month] = period.split("-").map(Number);
  const date = new Date(year, month - 2, 1);
  return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, "0")}`;
}

function dashboardMetricsFor(period) {
  const sector = document.querySelector("#dashboardSector")?.value || "all";
  const metrics = implementedConfigs().map((config) => {
    if (sector !== "all" && config.id !== sector) return null;
    const rows = calculatedRows(config.id).filter((row) => row.data && row.data.startsWith(period));
    const total = rows.reduce((sum, row) => sum + getRowTotal(row, config), 0);
    const cost = rows.reduce((sum, row) => sum + getRowCost(row), 0);
    const productivity = average(rows, getRowProductivity);
    const costPerProduction = total ? cost / total : 0;
    return { total, cost, productivity, costPerProduction, rows };
  }).filter((item) => item && item.rows.length);
  const totalProduction = metrics.reduce((sum, item) => sum + item.total, 0);
  const totalCost = metrics.reduce((sum, item) => sum + item.cost, 0);
  const avgProductivity = metrics.length ? metrics.reduce((sum, item) => sum + item.productivity, 0) / metrics.length : 0;
  const avgCost = totalProduction ? totalCost / totalProduction : 0;
  return { totalProduction, totalCost, avgProductivity, avgCost };
}

function dashboardDeltas(current) {
  const period = document.querySelector("#dashboardPeriod")?.value || "all";
  const previous = previousMonth(period);
  if (!previous) return {};
  const prev = dashboardMetricsFor(previous);
  return {
    totalProduction: percentChange(current.totalProduction, prev.totalProduction),
    totalCost: percentChange(current.totalCost, prev.totalCost),
    avgProductivity: percentChange(current.avgProductivity, prev.avgProductivity),
    avgCost: percentChange(current.avgCost, prev.avgCost),
  };
}

function percentChange(current, previous) {
  if (!previous) return null;
  return (current - previous) / previous;
}

function formatDelta(value) {
  if (value === null || value === undefined || Number.isNaN(value)) return "Variação: --";
  const sign = value > 0 ? "+" : "";
  return `Vs mês anterior: ${sign}${formatNumber(value * 100, 1)}%`;
}

function renderDashboardSectorBars(metrics, totalProduction) {
  const maxTotal = Math.max(...metrics.map((item) => item.total), 1);
  const rows = metrics
    .sort((a, b) => b.total - a.total)
    .map((item) => {
      const width = Math.max(3, (item.total / maxTotal) * 100);
      const share = totalProduction ? item.total / totalProduction : 0;
      return `
        <div class="sector-row">
          <span>${item.config.name}</span>
          <div class="sector-track"><div style="width:${width}%"></div></div>
          <strong>${formatNumber(item.total)}</strong>
          <small>${formatPercent(share)}</small>
        </div>
      `;
    }).join("");
  document.querySelector("#dashboardSectorBars").innerHTML = rows || `<div class="empty-state">Sem produção no período.</div>`;
}

function renderDashboardRanking(metrics) {
  const productivityRows = [...metrics]
    .sort((a, b) => b.productivity - a.productivity)
    .map((item) => `<div class="rank-row"><span>${item.config.name}</span><strong>${formatNumber(item.productivity, 1)}</strong></div>`)
    .join("");
  const costRows = [...metrics]
    .sort((a, b) => b.costPerProduction - a.costPerProduction)
    .map((item) => `<div class="rank-row"><span>${item.config.name}</span><strong>${formatCurrency(item.costPerProduction)}</strong></div>`)
    .join("");
  const productivityTarget = document.querySelector("#dashboardRanking");
  if (productivityTarget) productivityTarget.innerHTML = productivityRows || `<div class="empty-state">Sem dados.</div>`;
  document.querySelector("#dashboardCostRanking").innerHTML = costRows || `<div class="empty-state">Sem dados.</div>`;
}

function renderDashboardMix(metrics, totalProduction) {
  const rows = [...metrics]
    .sort((a, b) => b.total - a.total)
    .map((item) => {
      const share = totalProduction ? item.total / totalProduction : 0;
      return `
        <div class="mix-row">
          <div>
            <span>${item.config.name}</span>
            <strong>${formatPercent(share)}</strong>
          </div>
          <div class="mix-track"><div style="width:${Math.max(3, share * 100)}%"></div></div>
        </div>
      `;
    }).join("");
  document.querySelector("#dashboardMix").innerHTML = rows || `<div class="empty-state">Sem dados.</div>`;
}

function renderDashboardMonthlyChart() {
  const months = new Map();
  const metric = document.querySelector("#dashboardMetric")?.value || "production";
  const sector = document.querySelector("#dashboardSector")?.value || "all";
  const period = document.querySelector("#dashboardPeriod")?.value || "all";
  implementedConfigs().forEach((config) => {
    if (sector !== "all" && config.id !== sector) return;
    calculatedRows(config.id).forEach((row) => {
      if (!row.data) return;
      const key = row.data.slice(0, 7);
      const current = months.get(key) || { production: 0, cost: 0, productivitySum: 0, productivityCount: 0 };
      current.production += getRowTotal(row, config);
      current.cost += getRowCost(row);
      const productivity = getRowProductivity(row);
      if (productivity) {
        current.productivitySum += productivity;
        current.productivityCount += 1;
      }
      months.set(key, current);
    });
  });
  let entries = [...months.entries()].sort(([a], [b]) => a.localeCompare(b));
  if (period !== "all") {
    const previous = previousMonth(period);
    entries = entries.filter(([key]) => key === period || key === previous);
  }
  const data = entries.map(([key, item]) => ({
    key,
    value: metric === "cost" ? item.cost : metric === "productivity" ? (item.productivityCount ? item.productivitySum / item.productivityCount : 0) : item.production,
  }));
  const maxValue = Math.max(...data.map((item) => item.value), 1);
  document.querySelector("#dashboardMonthChart").innerHTML = data.map((item) => {
    const height = Math.max(8, (item.value / maxValue) * 150);
    const value = metric === "cost" ? formatCurrency(item.value) : formatNumber(item.value, metric === "productivity" ? 1 : 0);
    return `
      <div class="month-bar">
        <div class="month-column" style="height:${height}px"></div>
        <strong>${value}</strong>
        <span>${monthLabel(item.key)}</span>
      </div>
    `;
  }).join("") || `<div class="empty-state">Sem dados mensais.</div>`;
}

function renderDashboardSummaryTable(metrics, totalProduction) {
  const rows = [...metrics]
    .sort((a, b) => b.total - a.total)
    .map((item) => {
      const share = totalProduction ? item.total / totalProduction : 0;
      return `
        <tr>
          <td>${item.config.name}</td>
          <td>${item.rows.length}</td>
          <td>${formatNumber(item.total)}</td>
          <td>${formatCurrency(item.cost)}</td>
          <td>${formatCurrency(item.costPerProduction)}</td>
          <td>${formatPercent(share)}</td>
        </tr>
      `;
    }).join("");
  document.querySelector("#dashboardSummaryTable").innerHTML = rows || `<tr><td class="empty-state" colspan="6">Sem dados no período.</td></tr>`;
}

function renderDashboardConsolidated() {
  const period = selectedDashboardPeriod();
  const months = dashboardYearMonths(period);
  const selectedLabel = period ? monthLabel(period).toUpperCase() : "Mês atual";
  const sector = document.querySelector("#dashboardSector")?.value || "all";
  const configs = implementedConfigs().filter((config) => sector === "all" || config.id === sector);
  document.querySelector("#consolidatedTitle").textContent = `Produção mensal dos setores - ${selectedLabel}`;
  document.querySelector("#dashboardMetricsHead").innerHTML = `
    <tr>
      <th>Setor</th>
      ${months.map((month) => `<th>${month.label}</th>`).join("")}
      <th>Unid.</th>
    </tr>
  `;
  document.querySelector("#dashboardMetricsBody").innerHTML = configs.map((config, index) => {
    return `
      <tr>
        <td>${index + 1}. ${config.name}</td>
        ${months.map((month) => `<td>${formatNumber(dashboardMonthTotal(config, month.key, getRowTotal), config.id === "galvanoplastia" ? 1 : 0)}</td>`).join("")}
        <td>${dashboardMetricUnit(config)}</td>
      </tr>
    `;
  }).join("") || `<tr><td class="empty-state" colspan="14">Sem produção no período.</td></tr>`;
  document.querySelector("#dashboardCostHead").innerHTML = `
    <tr>
      <th>Setor</th>
      ${months.map((month) => `<th>${month.label}</th>`).join("")}
      <th>Custo médio</th>
    </tr>
  `;
  document.querySelector("#dashboardCostBody").innerHTML = configs.map((config, index) => {

    const values = monthlyCosts.filter((value) => value > 0);
    const avgCost = values.length ? values.reduce((sum, value) => sum + value, 0) / values.length : 0;
    return `
      <tr>
        <td>${index + 1}. ${config.name}</td>
        ${monthlyCosts.map((value) => `<td>${value ? formatCurrency(value) : ""}</td>`).join("")}
        <td>${avgCost ? formatCurrency(avgCost) : ""}</td>
      </tr>
    `;
  }).join("") || `<tr><td class="empty-state" colspan="14">Sem custo no período.</td></tr>`;
}

function renderVisualManagement(metrics) {
  const period = selectedDashboardPeriod();
  const sortedByProduction = [...metrics].sort((a, b) => b.total - a.total);
  const sortedByCost = [...metrics].filter((item) => item.costPerProduction).sort((a, b) => b.costPerProduction - a.costPerProduction);
  const chain = ["iqSemiacabado", "tratamento", "galvanoplastia", "posBanho", "etiquetagem", "colagem"]
    .map((id) => {
      const config = configFor(id);
      const pieces = dashboardMonthTotal(config, period, getRowPiecesTotal);
      return { config, pieces };
    })
    .filter((item) => item.config && item.pieces);
  const bottlenecks = chain.slice(1).map((item, index) => {
    const previous = chain[index];
    const gap = previous ? previous.pieces - item.pieces : 0;
    const ratio = previous?.pieces ? gap / previous.pieces : 0;
    return { ...item, previous, gap, ratio };
  }).filter((item) => item.gap > 0).sort((a, b) => b.ratio - a.ratio);
  const bottleneck = bottlenecks[0];
  document.querySelector("#factoryBottleneck").textContent = bottleneck ? bottleneck.config.name : "Sem gargalo";
  document.querySelector("#factoryBottleneckDetail").textContent = bottleneck
    ? `${formatNumber(bottleneck.gap)} peças abaixo da etapa anterior`
    : "Fluxo sem queda relevante no período.";
  document.querySelector("#factoryTopProduction").textContent = sortedByProduction[0]?.config.name || "--";
  document.querySelector("#factoryTopProductionDetail").textContent = sortedByProduction[0] ? `${formatNumber(sortedByProduction[0].total)} produzidos` : "--";
  document.querySelector("#factoryTopCost").textContent = sortedByCost[0]?.config.name || "--";
  document.querySelector("#factoryTopCostDetail").textContent = sortedByCost[0] ? `${formatCurrency(sortedByCost[0].costPerProduction)} por unidade` : "--";

  const galvano = configFor("galvanoplastia");
  const galvanoRows = periodRows(galvano, period);
  const galvanoPieces = galvanoRows.reduce((sum, row) => sum + numberValue(row.qtdPecas), 0);
  const galvanoKg = galvanoRows.reduce((sum, row) => sum + numberValue(row.kgTotal), 0);
  document.querySelector("#factoryGalvano").textContent = `${formatNumber(galvanoPieces)} pçs / ${formatNumber(galvanoKg, 1)} kg`;

  const etiqueta = configFor("etiquetagem");
  const etiquetaRows = periodRows(etiqueta, period);
  const etiquetaPieces = etiquetaRows.reduce((sum, row) => sum + numberValue(row.qtdPecas), 0);
  const etiquetaTags = etiquetaRows.reduce((sum, row) => sum + numberValue(row.tagsProduzidas), 0);
  document.querySelector("#factoryEtiquetagem").textContent = `${formatNumber(etiquetaPieces)} pçs / ${formatNumber(etiquetaTags)} tags`;

  const colagem = configFor("colagem");
  const colagemRows = periodRows(colagem, period);
  const colagemPieces = colagemRows.reduce((sum, row) => sum + numberValue(row.qtdPecas), 0);
  const colagemTags = colagemRows.reduce((sum, row) => sum + numberValue(row.tagsPreco || row.tagsCampinas), 0);
  document.querySelector("#factoryColagem").textContent = `${formatNumber(colagemPieces)} pçs / ${formatNumber(colagemTags)} tags`;
}

function logInput(config, row) {
  const operationalFields = config.fields
    .filter((field) => !isProtectedField(field) && field.key !== "observacoes")
    .map((field) => `${field.label}: ${row[field.key] || 0}`);
  coState.inputLogs.unshift({
    id: crypto.randomUUID(),
    processId: config.id,
    processName: config.name,
    profile: coState.masterUnlocked ? "Gestor Master" : "Usuário comum",
    createdAt: new Date().toISOString(),
    summary: operationalFields.join(" | "),
  });
  coState.inputLogs = coState.inputLogs.slice(0, 500);
  saveInputLogs();
  supabaseInsert("input_logs", {
    process_id: config.id,
    process_name: config.name,
    profile: coState.masterUnlocked ? "Gestor Master" : "Usuário comum",
    summary: operationalFields.join(" | "),
  });
}

function monthlyCloseRows(period) {
  return implementedConfigs().map((config) => {
    const rows = periodRows(config, period);
    const production = rows.reduce((sum, row) => sum + getRowTotal(row, config), 0);
    const cost = rows.reduce((sum, row) => sum + getRowCost(row), 0);
    const people = rows.reduce((sum, row) => sum + getRowPeople(row), 0);
    return {
      period,
      processId: config.id,
      processName: config.name,
      production,
      cost,
      costPerPerson: people ? cost / people : 0,
      costPerPiece: production ? cost / production : 0,
    };
  });
}

function closeSelectedMonth() {
  const period = selectedDashboardPeriod();
  if (!period) return;
  const closedAt = new Date().toISOString();
  const rows = monthlyCloseRows(period).map((row) => ({ ...row, id: crypto.randomUUID(), closedAt }));
  coState.monthlyClosings = coState.monthlyClosings.filter((row) => row.period !== period).concat(rows);
  saveMonthlyClosings();
  rows.forEach((row) => supabaseUpsert("monthly_closings", row, "period,process_id"));
  renderMonthlyClose();
}

function renderMonthlyClose() {
  const rows = [...coState.monthlyClosings].sort((a, b) => b.period.localeCompare(a.period) || a.processName.localeCompare(b.processName));
  document.querySelector("#monthlyCloseTable").innerHTML = rows.length ? rows.map((row) => `
    <tr>
      <td>${monthLabel(row.period)}</td>
      <td>${row.processName}</td>
      <td>${formatNumber(row.production, row.processId === "galvanoplastia" ? 1 : 0)}</td>
      <td>${formatCurrency(row.cost)}</td>
      <td>${formatCurrency(row.costPerPerson)}</td>
      <td>${formatCurrency(row.costPerPiece)}</td>
      <td>${new Date(row.closedAt).toLocaleString("pt-BR")}</td>
    </tr>
  `).join("") : `<tr><td class="empty-state" colspan="7">Nenhum fechamento realizado.</td></tr>`;
}

function getFormRow() {
  const config = formConfig();
  if (!config) return {};
  const row = {};
  config.fields.forEach((field) => {
    const element = document.querySelector(`#field-${field.key}`);
    if (!element) return;
    row[field.key] = field.type === "number" ? numberValue(element.value) : element.value.trim();
  });
  return row;
}

function updatePreview() {
  const config = formConfig();
  if (!config) return;
  const calculated = config.calculate(getFormRow());
  const total = numberValue(calculated[config.totalKey]);
  document.querySelector("#previewTotal").textContent = formatNumber(total);
  document.querySelector("#previewPerPerson").textContent = formatNumber(calculated.producaoColaborador, 1);
  document.querySelector("#previewGoal").textContent = calculated.percentualMeta ? formatPercent(calculated.percentualMeta) : "Sem meta";
}

function clearForm() {
  const config = formConfig();
  if (!config) return;
  renderForm(config);
  updatePreview();
}

function addRow(row) {
  const config = formConfig();
  if (!config) return;
  coState.rows[config.id].push({
    id: crypto.randomUUID(),
    ...row,
    createdAt: new Date().toISOString(),
  });
  saveRows(config.id, coState.rows[config.id]);
  invalidateProcessCache(config.id);
  supabaseInsert("operational_records", {
    process_id: config.id,
    process_name: config.name,
    payload: row,
    created_by_profile: coState.masterUnlocked ? "Gestor Master" : "Usuário comum",
  });
  logInput(config, row);
  renderLaunch();
  if (coState.activeProcessId === config.id) renderProcess();
  if (coState.activeProcessId === "dashboard") renderDashboard();
}

function restoreRealData() {
  const config = configFor();
  const dataset = DATASETS[config.id];
  coState.rows[config.id] = dataset.rows.map((row) => ({
    id: crypto.randomUUID(),
    ...row,
    createdAt: new Date().toISOString(),
  }));
  saveRows(config.id, coState.rows[config.id]);
  invalidateProcessCache(config.id);
  localStorage.setItem(`ph-${config.id}-data-version`, dataset.version);
  renderProcess();
}

function exportCsv() {
  const config = configFor();
  const columns = config.columns.filter((column) => column.key !== "actions");
  const header = columns.map((column) => column.label);
  const body = calculatedRows(config.id).map((row) => columns.map((column) => {
    if (column.key === "data") return formatDate(row.data);
    if (column.percent) return formatPercent(row[column.key]);
    if (column.currency) return row[column.key] ? formatCurrency(row[column.key]) : "";
    return row[column.key] ?? "";
  }));
  const csv = [header, ...body].map((line) => line.map((value) => `"${String(value).replaceAll('"', '""')}"`).join(",")).join("\n");
  const blob = new Blob([csv], { type: "text/csv;charset=utf-8" });
  const link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = config.exportName;
  link.click();
  URL.revokeObjectURL(link.href);
}

function renderAccessState() {
  const label = coState.masterUnlocked ? "Gestor Master" : "Usuário comum";
  const action = coState.masterUnlocked ? "Sair do Master" : coState.masterAccount.mustChangePassword ? "Primeiro acesso Master" : "Entrar como Master";
  document.querySelector("#globalAccessStatus").textContent = label;
  document.querySelector("#globalMasterButton").textContent = action;
  const localStatus = document.querySelector("#masterStatus");
  const localButton = document.querySelector("#masterLoginButton");
  if (localStatus) localStatus.textContent = coState.masterUnlocked ? "Liberado" : "Bloqueado";
  if (localButton) localButton.textContent = coState.masterUnlocked ? "Sair" : "Entrar";
}

function openMasterModal() {
  document.querySelector("#masterModal").hidden = false;
  document.querySelector("#masterModalTitle").textContent = "Acesso restrito";
  document.querySelector("#masterLoginFields").hidden = false;
  document.querySelector("#masterPasswordChangeFields").hidden = true;
  document.querySelector("#masterSubmitButton").textContent = "Liberar";
  document.querySelector("#masterUser").value = "";
  document.querySelector("#masterPassword").value = "";
  document.querySelector("#masterNewPassword").value = "";
  document.querySelector("#masterConfirmPassword").value = "";
  document.querySelector("#masterLoginMessage").textContent = "";
  coState.masterLoginVerified = false;
  document.querySelector("#masterUser").focus();
}

function openPasswordChangeMode() {
  document.querySelector("#masterModalTitle").textContent = "Trocar senha inicial";
  document.querySelector("#masterLoginFields").hidden = true;
  document.querySelector("#masterPasswordChangeFields").hidden = false;
  document.querySelector("#masterSubmitButton").textContent = "Salvar senha";
  document.querySelector("#masterLoginMessage").textContent = "Primeiro acesso: cadastre uma senha definitiva para liberar o Master.";
  document.querySelector("#masterNewPassword").focus();
}

function closeMasterModal() {
  document.querySelector("#masterModal").hidden = true;
  coState.masterLoginVerified = false;
}

function lockMasterAccess() {
  coState.masterUnlocked = false;
  coState.launchProcessId = null;
  setActiveProcess("launch");
}

function unlockMasterAccess() {
  coState.masterUnlocked = true;
  coState.masterLoginVerified = false;
  closeMasterModal();
  renderProcessNav();
  renderLaunch();
}

function changeMasterPassword() {
  const newPassword = document.querySelector("#masterNewPassword").value;
  const confirmPassword = document.querySelector("#masterConfirmPassword").value;
  if (newPassword.length < 6) {
    document.querySelector("#masterLoginMessage").textContent = "A nova senha precisa ter pelo menos 6 caracteres.";
    return;
  }
  if (newPassword !== confirmPassword) {
    document.querySelector("#masterLoginMessage").textContent = "A confirmação não confere com a nova senha.";
    return;
  }
  coState.masterAccount = {
    ...coState.masterAccount,
    password: newPassword,
    mustChangePassword: false,
  };
  saveMasterAccount();
  unlockMasterAccess();
}

function wireEvents() {
  document.querySelector("#processNav").addEventListener("click", (event) => {
    const button = event.target.closest("[data-process]");
    if (!button) return;
    setActiveProcess(button.dataset.process);
  });
  form.addEventListener("input", updatePreview);
  form.addEventListener("submit", (event) => {
    event.preventDefault();
    addRow(getFormRow());
    clearForm();
  });
  document.querySelector("#clearFormButton").addEventListener("click", clearForm);
  document.querySelector("#seedButton").addEventListener("click", restoreRealData);
  document.querySelector("#exportButton").addEventListener("click", exportCsv);
  document.querySelector("#dashboardPeriod").addEventListener("change", renderDashboard);
  document.querySelector("#dashboardSector").addEventListener("change", renderDashboard);
  document.querySelector("#dashboardMetric").addEventListener("change", renderDashboard);
  document.querySelector("#closeMonthButton").addEventListener("click", () => {
    closeSelectedMonth();
    setActiveProcess("monthlyClose");
  });
  document.querySelector("#logsSectorFilter").addEventListener("change", renderLogs);
  document.querySelector("#launchSectorPicker").addEventListener("click", (event) => {
    const button = event.target.closest("[data-launch-process]");
    if (!button) return;
    coState.launchProcessId = button.dataset.launchProcess;
    renderLaunch();
  });
  document.querySelector("#changeLaunchSectorButton").addEventListener("click", () => {
    coState.launchProcessId = null;
    renderLaunch();
  });
  document.querySelector("#masterLoginButton").addEventListener("click", () => {
    if (coState.masterUnlocked) {
      lockMasterAccess();
      return;
    }
    openMasterModal();
  });
  document.querySelector("#globalMasterButton").addEventListener("click", () => {
    if (coState.masterUnlocked) {
      lockMasterAccess();
      return;
    }
    openMasterModal();
  });
  document.querySelector("#masterCancelButton").addEventListener("click", closeMasterModal);
  document.querySelector("#masterLoginForm").addEventListener("submit", (event) => {
    event.preventDefault();
    if (coState.masterLoginVerified && coState.masterAccount.mustChangePassword) {
      changeMasterPassword();
      return;
    }
    const user = document.querySelector("#masterUser").value.trim();
    const password = document.querySelector("#masterPassword").value;
    if (user === coState.masterAccount.user && password === coState.masterAccount.password) {
      if (coState.masterAccount.mustChangePassword) {
        coState.masterLoginVerified = true;
        openPasswordChangeMode();
        return;
      }
      unlockMasterAccess();
      return;
    }
    document.querySelector("#masterLoginMessage").textContent = "Login ou senha inválidos.";
  });
  searchInput.addEventListener("input", () => renderTable(configFor()));
  document.querySelector("#tableBody").addEventListener("click", (event) => {
    const button = event.target.closest("[data-delete]");
    if (!button) return;
    const config = configFor();
    coState.rows[config.id] = coState.rows[config.id].filter((row) => row.id !== button.dataset.delete);
    saveRows(config.id, coState.rows[config.id]);
    invalidateProcessCache(config.id);
    renderProcess();
  });
}

function init() {
  // wireEvents();
  const params = new URLSearchParams(window.location.search);
  setActiveProcess(params.get("process") || "launch");
}

// helpers formato
function coFmt(v,d=0){return(+v||0).toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d});}
function coBRL(v){return(+v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});}
function coPct(v){return v?`${coFmt(v*100,1)}%`:'';}

function coGetPeriod(){
  const el=document.getElementById('co_period_sel');
  return el?el.value:'all';
}
function coGetSector(){
  const el=document.getElementById('co_sector_sel');
  return el?el.value:'all';
}

function addRow_co(cfg,row){
  coState.rows[cfg.id].push({id:crypto.randomUUID(),...row,createdAt:new Date().toISOString()});
  saveRows(cfg.id,coState.rows[cfg.id]);
  invalidateProcessCache(cfg.id);
  // log
  const fields=cfg.fields.filter(f=>!isProtectedField(f)&&f.key!=='observacoes')
    .map(f=>`${f.label}: ${row[f.key]||0}`);
  coState.inputLogs.unshift({id:crypto.randomUUID(),processId:cfg.id,processName:cfg.name,
    profile:coState.masterUnlocked?'Gestor Master':'Usuário comum',
    createdAt:new Date().toISOString(),summary:fields.join(' | ')});
  coState.inputLogs=coState.inputLogs.slice(0,500);
  saveInputLogs();
}

  const chain=['iqSemiacabado','tratamento','galvanoplastia','posBanho','etiquetagem','colagem']
    .map(id=>{const cfg=configFor(id);if(!cfg)return null;
      const p=period!=='all'?period:selectedDashboardPeriod();
      const pieces=p?dashboardMonthTotal(cfg,p,getRowPiecesTotal):

      return {cfg,pieces};
    }).filter(Boolean);
  const bottlenecks=chain.slice(1).map((item,i)=>{
    const prev2=chain[i];

  }).filter(x=>x.gap>0).sort((a,b)=>b.ratio-a.ratio);
  const btl=bottlenecks[0];
  const sortedByCost=[...metrics].filter(m=>m.costPerProduction).sort((a,b)=>b.costPerProduction-a.costPerProduction);

    track.appendChild(fill);

    row.appendChild(h('small',{style:{width:'45px',textAlign:'right',fontSize:'11px',color:'#6b7280'}},coPct(totalProd?m.total/totalProd:0)));
    barBox.appendChild(row);

  pg.appendChild(barBox);

  // Tabela consolidada meses

  const months=dashboardYearMonths(p2);
  const secFilt=coGetSector();
  const cfgsToShow=implementedConfigs().filter(c=>secFilt==='all'||c.id===secFilt);

  const costWrap=h('div',{style:{overflowX:'auto'}});
  const costTable=h('table',{style:{width:'100%',borderCollapse:'collapse',fontSize:'12px'}});

    const th=h('th',{style:{padding:'8px 12px',textAlign:i===0?'left':'right',fontSize:'10px',color:'#6b7280',textTransform:'uppercase',letterSpacing:'0.3px',borderBottom:'2px solid #e5e7eb',whiteSpace:'nowrap',background:'#f9fafb'}},col.label||col.label);
    cHr.appendChild(th);

  cHead.appendChild(cHr);
  costTable.appendChild(cHead);
  const cBody=h('tbody',{});
  cfgsToShow.forEach((cfg2,idx)=>{

    tr.appendChild(h('td',{style:{padding:'8px 12px',borderBottom:'1px solid #f3f4f6',color:'#374151',whiteSpace:'nowrap'}},`${idx+1}. ${cfg2.name}`));

function renderCOLogs(){
  const pg=h('div',{style:{padding:'24px',maxWidth:'1100px',margin:'0 auto'},className:'fade-in'});

  const top=h('div',{style:{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:'20px',flexWrap:'wrap',gap:'12px'}});
  const titDiv=h('div',{});

  titDiv.appendChild(h('h2',{style:{margin:'0',fontSize:'20px',fontWeight:'700',color:'#111827'}},'Logs & Fechamento'));
  top.appendChild(titDiv);
  pg.appendChild(top);

  // ── Fechamento mensal ──
  const closeBox=h('div',{style:{background:'#fff',border:'1px solid #e5e7eb',borderRadius:'12px',marginBottom:'16px',overflow:'hidden'}});
  closeBox.appendChild(h('div',{style:{padding:'12px 20px',borderBottom:'1px solid #e5e7eb',fontSize:'11px',color:'#6b7280',fontWeight:'700',textTransform:'uppercase',letterSpacing:'0.5px'}},'Fechamentos Mensais'));
  const closeWrap=h('div',{style:{overflowX:'auto'}});
  const closeTable=h('table',{style:{width:'100%',borderCollapse:'collapse',fontSize:'12px'}});
  const clHead=h('thead',{});
  const clHr=h('tr',{});
  ['Mês','Setor','Produção','Custo total','Custo/pessoa','Custo/peça','Fechado em'].forEach((lbl,i)=>{
    clHr.appendChild(h('th',{style:{padding:'8px 12px',textAlign:i<2?'left':'right',fontSize:'10px',color:'#6b7280',textTransform:'uppercase',letterSpacing:'0.3px',borderBottom:'2px solid #e5e7eb',whiteSpace:'nowrap',background:'#f9fafb'}},lbl));
  });
  clHead.appendChild(clHr);
  closeTable.appendChild(clHead);
  const clBody=h('tbody',{});
  const closings=[...coState.monthlyClosings].sort((a,b)=>b.period.localeCompare(a.period)||a.processName.localeCompare(b.processName));
  if(!closings.length){
    const tr=h('tr',{});
    tr.appendChild(h('td',{colspan:'7',style:{padding:'32px',textAlign:'center',color:'#9ca3af',fontStyle:'italic'}},'Nenhum fechamento realizado. Use "Fechar Mês" na Visão da Fábrica.'));
    clBody.appendChild(tr);
  } else {
    closings.forEach(row=>{
      const tr=h('tr',{});
      tr.addEventListener('mouseenter',()=>tr.style.background='#f9fafb');
      tr.addEventListener('mouseleave',()=>tr.style.background='');
      [monthLabel(row.period),row.processName,coFmt(row.production,row.processId==='galvanoplastia'?1:0),
       coBRL(row.cost),coBRL(row.costPerPerson),coBRL(row.costPerPiece),
       new Date(row.closedAt).toLocaleString('pt-BR')].forEach((val,i)=>{
        tr.appendChild(h('td',{style:{padding:'8px 12px',borderBottom:'1px solid #f3f4f6',textAlign:i<2?'left':'right',color:'#374151',whiteSpace:'nowrap'}},val));
      });
      clBody.appendChild(tr);
    });
  }
  closeTable.appendChild(clBody);
  closeWrap.appendChild(closeTable);
  closeBox.appendChild(closeWrap);
  pg.appendChild(closeBox);

  // ── Logs de inputs ──
  const logBox=h('div',{style:{background:'#fff',border:'1px solid #e5e7eb',borderRadius:'12px',overflow:'hidden'}});
  const logHead=h('div',{style:{padding:'12px 20px',borderBottom:'1px solid #e5e7eb',display:'flex',alignItems:'center',justifyContent:'space-between',flexWrap:'wrap',gap:'8px'}});
  logHead.appendChild(h('div',{style:{fontSize:'11px',color:'#6b7280',fontWeight:'700',textTransform:'uppercase',letterSpacing:'0.5px'}},'Logs de Inputs'));
  // filtro setor
  const logFilter=h('select',{style:{padding:'6px 10px',border:'1px solid #e5e7eb',borderRadius:'8px',fontSize:'12px',color:'#111827',background:'#fff',outline:'none'},
    onChange:()=>setState({aba:'co_logs'})});
  logFilter.appendChild(h('option',{value:'all'},'Todos os setores'));
  implementedConfigs().forEach(cfg2=>logFilter.appendChild(h('option',{value:cfg2.id},cfg2.name)));
  logHead.appendChild(logFilter);
  logBox.appendChild(logHead);

  const logWrap=h('div',{style:{overflowX:'auto',maxHeight:'500px',overflowY:'auto'}});
  const logTable=h('table',{style:{width:'100%',borderCollapse:'collapse',fontSize:'12px'}});
  const lgHead=h('thead',{});
  const lgHr=h('tr',{});
  ['Data/hora','Setor','Perfil','Resumo do input'].forEach((lbl,i)=>{
    lgHr.appendChild(h('th',{style:{padding:'8px 12px',textAlign:'left',fontSize:'10px',color:'#6b7280',textTransform:'uppercase',letterSpacing:'0.3px',borderBottom:'2px solid #e5e7eb',whiteSpace:'nowrap',background:'#f9fafb',position:'sticky',top:'0'}},lbl));
  });
  lgHead.appendChild(lgHr);
  logTable.appendChild(lgHead);
  const lgBody=h('tbody',{});
  const selSec=logFilter.value||'all';
  const logs=coState.inputLogs.filter(l=>selSec==='all'||l.processId===selSec);
  if(!logs.length){
    const tr=h('tr',{});
    tr.appendChild(h('td',{colspan:'4',style:{padding:'32px',textAlign:'center',color:'#9ca3af',fontStyle:'italic'}},'Nenhum input registrado.'));
    lgBody.appendChild(tr);
  } else {
    logs.forEach(log=>{
      const tr=h('tr',{});
      tr.addEventListener('mouseenter',()=>tr.style.background='#f9fafb');
      tr.addEventListener('mouseleave',()=>tr.style.background='');
      [new Date(log.createdAt).toLocaleString('pt-BR'),log.processName,log.profile,log.summary]
        .forEach(val=>tr.appendChild(h('td',{style:{padding:'8px 12px',borderBottom:'1px solid #f3f4f6',color:'#374151',maxWidth:'400px',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}},val)));
      lgBody.appendChild(tr);
    });
  }
  logTable.appendChild(lgBody);
  logWrap.appendChild(logTable);
  logBox.appendChild(logWrap);
  pg.appendChild(logBox);
  return pg;
}

// ── Modal Master do CO ──
function coOpenMasterModal(onSuccess){
  const overlay=h('div',{style:{position:'fixed',inset:'0',background:'rgba(0,0,0,0.5)',zIndex:'10000',display:'flex',alignItems:'center',justifyContent:'center',padding:'20px'}});
  const modal=h('div',{style:{background:'#fff',borderRadius:'14px',padding:'28px 24px',maxWidth:'320px',width:'100%',boxShadow:'0 20px 60px rgba(0,0,0,0.25)'}});
  modal.appendChild(h('h3',{style:{margin:'0 0 16px',fontSize:'16px',fontWeight:'700',color:'#111827'}},'Acesso Master'));
  const mkLbl=(lbl,type,id)=>{
    const l=h('label',{style:{display:'flex',flexDirection:'column',gap:'4px',fontSize:'12px',color:'#374151',fontWeight:'600',marginBottom:'12px'}});
    l.appendChild(h('span',{},lbl));
    l.appendChild(h('input',{type,id,style:{padding:'9px 12px',border:'1px solid #d1d5db',borderRadius:'8px',fontSize:'13px',color:'#111827',outline:'none'}}));
    return l;
  };
  modal.appendChild(mkLbl('Login','text','co_master_user'));
  modal.appendChild(mkLbl('Senha','password','co_master_pwd'));
  const msg=h('p',{style:{color:'#dc2626',fontSize:'12px',minHeight:'16px',margin:'0 0 12px'}});
  modal.appendChild(msg);
  const btns=h('div',{style:{display:'flex',gap:'8px'}});
  btns.appendChild(h('button',{style:{flex:'1',padding:'9px',background:'#f3f4f6',border:'1px solid #e5e7eb',borderRadius:'8px',fontSize:'13px',fontWeight:'600',cursor:'pointer',color:'#374151'},
    onClick:()=>document.body.removeChild(overlay)},'Cancelar'));
  btns.appendChild(h('button',{style:{flex:'1',padding:'9px',background:'#0d6b6f',border:'none',borderRadius:'8px',fontSize:'13px',fontWeight:'700',cursor:'pointer',color:'#fff'},
    onClick:()=>{
      const u=document.getElementById('co_master_user').value.trim();
      const p=document.getElementById('co_master_pwd').value;
      if(u===coState.masterAccount.user&&p===coState.masterAccount.password){
        coState.masterUnlocked=true;
        document.body.removeChild(overlay);
        if(onSuccess) onSuccess();
      } else {
        msg.textContent='Login ou senha inválidos.';
      }
    }},'Liberar'));
  modal.appendChild(btns);
  overlay.addEventListener('click',e=>{if(e.target===overlay)document.body.removeChild(overlay);});
  document.body.appendChild(overlay);
  setTimeout(()=>document.getElementById('co_master_user')?.focus(),100);
}

render();
}

async function carregarTudo(){
  setState({dbStatus:"conectando"});
  try {
    const [r1,r2,r3,r4] = await Promise.all([
      db.from("producoes").select("*").eq("data",dataHoje),
      db.from("feed").select("*").order("criado_em",{ascending:false}).limit(100),
      db.from("planos").select("*").order("criado_em",{ascending:false}),
      db.from("producoes").select("*").order("data",{ascending:false}),
    ]);
    const map={};
    (r1.data||[]).forEach(p=>{
      // campo "dados" é o JSONB com os campos do formulário
      // fallback: se não vier, tenta usar o próprio objeto menos os metadados
      if(p.dados && typeof p.dados === "object") {
        map[p.setor_id] = p.dados;
      } else {
        // tenta extrair campos úteis do objeto raiz
        const {id,setor_id,data,usuario,atualizado_em,...resto} = p;
        map[p.setor_id] = Object.keys(resto).length ? resto : {};
      }
    });
    console.log("📦 Producoes carregadas:", JSON.stringify(map).substring(0,500));
    setState({
      producoes:map,
      feed:r2.data||[],
      planos:r3.data||[],
      hist:r4.data||[],
      histCarregado:true,
      histCarregando:false,
      dbStatus:"online"
    });
  } catch(e){
    setState({dbStatus:"erro"});
    showToast("Erro ao conectar com o banco.","erro");
  }
}

function iniciarRealtime(){
  db.channel("pink-heart-rt")
    .on("postgres_changes",{event:"INSERT",schema:"public",table:"feed"}, p=>{
      setState(s=>({feed:[p.new,...s.feed]}));
    })
    .on("postgres_changes",{event:"UPDATE",schema:"public",table:"feed"}, p=>{
      setState(s=>({feed:s.feed.map(f=>f.id===p.new.id?p.new:f)}));
    })
    .on("postgres_changes",{event:"*",schema:"public",table:"producoes"}, p=>{
      if(p.new?.data===dataHoje)
        setState(s=>({producoes:{...s.producoes,[p.new.setor_id]:p.new.dados||p.new}}));
    })
    .subscribe();
}

let _carregandoHist = false;
async function carregarHistorico(){
  if(_carregandoHist) return;
  _carregandoHist = true;
  state.histCarregando = true;
  state.histCarregado = false;
  try{
    const {data, error}=await db.from("producoes").select("*").order("data",{ascending:false});
    if(error) throw error;
    state.hist = data||[];
    state.histCarregado = true;
    state.histCarregando = false;
    _carregandoHist = false;
    render();
  } catch(e){
    console.error("Erro histórico:",e);
    state.histCarregando = false;
    _carregandoHist = false;
    render();
    showToast("Erro: "+e.message,"erro");
  }
}

async function salvarProducao(setorId){
  setState({salvando:true});
  const dados={...state.form, savedAt:new Date().toISOString(), savedBy:state.usuario};
  try{
    const {error:e1}=await db.from("producoes").upsert(
      {setor_id:setorId,data:dataHoje,dados,usuario:state.usuario,atualizado_em:new Date().toISOString()},
      {onConflict:"setor_id,data"}
    );
    if(e1) throw e1;
    let txt="";
    const f=state.form;
    if(setorId==="cadastros")
      txt=`✅ Cadastros: 🏷️ SKUs: ${f.skusGeradas||0} | 📋 O.P's: ${f.opsGeradas||0} | 📐 Lista Técnica: ${f.listaTecnica||0} | 🗂️ Itens: ${f.cadastroItens||0}`;
    else if(setorId==="almoxarifado")
      txt=`✅ Almoxarifado: 📦 Sep: ${f.separacao||0} | ✔️ Conf: ${f.conferencia||0} | 🔢 Cont: ${f.contagem||0} | 🚚 Env: ${f.servicoExternoEnviado||0} | 📥 Rec: ${f.servicoExternoRecebido||0}`;
    else if(setorId==="etiquetagem")
      txt=`✅ Etiquetagem: 🏷️ Recebidas: ${f.tagsRecebidas||0} | ✅ Etiquetadas: ${f.tagsEtiquetadas||0} | ❌ Perdidas: ${f.tagsPerdidas||0}`;
    else
      txt=`✅ Produção: ${f.pecasProduzidas} peças | ${f.pesoBruto}g → ${f.pesoAposProcesso}g | Perda: ${f.perda}g | ${f.banho}`;
    await db.from("feed").insert({usuario:state.usuario,setor_id:setorId,tipo:"update",texto:txt,likes:0,comentarios:[],data:dataHoje,criado_em:new Date().toISOString()});
    setState(s=>{
      // atualizar ou inserir no hist local
      const jaExiste=s.hist.findIndex(r=>r.setor_id===setorId&&r.data===dataHoje);
      const novoReg={setor_id:setorId,data:dataHoje,dados,usuario:state.usuario,atualizado_em:new Date().toISOString()};
      const novoHist=jaExiste>=0?s.hist.map((r,i)=>i===jaExiste?{...r,...novoReg}:r):[novoReg,...s.hist];
      return {producoes:{...s.producoes,[setorId]:dados},hist:novoHist,setorAtivo:null,aba:"dashboard",salvando:false};
    });
    showToast("Produção salva com sucesso! ✅");
  } catch(e){
    setState({salvando:false});
    showToast("Erro ao salvar. Verifique a conexão.","erro");
  }
}

async function enviarMsg(){
  if(!state.novaMsg.trim()) return;
  const {data,error}=await db.from("feed").insert({usuario:state.usuario,setor_id:"geral",tipo:state.tipoMsg,texto:state.novaMsg,likes:0,comentarios:[],data:dataHoje,criado_em:new Date().toISOString()}).select().single();
  if(!error && data) setState(s=>({feed:[data,...s.feed],novaMsg:""}));
  else setState({novaMsg:""});
}

async function curtir(post){
  const likes=(post.likes||0)+1;
  await db.from("feed").update({likes}).eq("id",post.id);
  setState(s=>({feed:s.feed.map(f=>f.id===post.id?{...f,likes}:f)}));
}

async function enviarComentario(post){
  if(!state.textoComentario.trim()) return;
  const comentarios=[...(post.comentarios||[]),{u:state.usuario,t:state.textoComentario}];
  await db.from("feed").update({comentarios}).eq("id",post.id);
  setState(s=>({feed:s.feed.map(f=>f.id===post.id?{...f,comentarios}:f),textoComentario:"",comentando:null}));
}

async function salvarPlano(){
  if(!state.novoPlano.titulo) return;
  const {data,error}=await db.from("planos").insert({...state.novoPlano,criado_em:new Date().toISOString(),criado_por:state.usuario}).select().single();
  if(error){showToast("Erro ao salvar plano.","erro");return;}
  setState(s=>({planos:[data,...s.planos],novoPlano:{titulo:"",responsavel:"",prazo:"",descricao:"",status:"pendente",progresso:0},mostrarFormPlano:false}));
  showToast("Plano criado! 📋");
}

async function atualizarPlano(id,changes){
  await db.from("planos").update(changes).eq("id",id);
  setState(s=>({planos:s.planos.map(p=>p.id===id?{...p,...changes}:p)}));
}

function showToast(msg,tipo="ok"){
  setState({toast:{msg,tipo}});
  setTimeout(()=>setState({toast:null}),3500);
}

function calcKpis(){
  // perdas consolidadas por setor
  let perdaTotal=0;
  const dE=dadosSetor("etiquetagem"), dG=dadosSetor("galvanoplastia"),
        dA=dadosSetor("almoxarifado"), dT=dadosSetor("tratamento"),
        dV=dadosSetor("verniz"),       dC=dadosSetor("colagem"),
        dP=dadosSetor("posbanho"),     dPE=dadosSetor("preelos"),
        dI=dadosSetor("inspecao"),     dF=dadosSetor("fundicao");

  // perda do tratamento: pecasPerdidas
  perdaTotal += Number(dT?.pesoPerdidas||0);
  // perda do pós banho: sucatas peso
  perdaTotal += Number(dP?.sucatasOuroPeso||0) + Number(dP?.sucatasRodioPeso||0);
  // perda pré elos: sucatas peso
  perdaTotal += Number(dPE?.sucatasOuroPeso||0) + Number(dPE?.sucatasRodioPeso||0);
  // perda verniz: campo perda genérico
  perdaTotal += Number(dV?.perda||0);

  // peças banhadas galvano
  const pecasBanhadasTotal = Number(dG?.pecasBanhadasOuro||0) + Number(dG?.pecasBanhadasRodio||0) + Number(dG?.pecasQuebec||0) + Number(dG?.pecasCataforetico||0);
  // peso ouro galvano
  const pesoOuro = Number(dG?.pesoBanhadoOuro||0);
  // peso ródio pós banho
  const pesoRodio = Number(dP?.pesoRevRodio||0);
  // peso cataforético galvano
  const pesoCat = Number(dG?.pesoCataforetico||0);
  // amarrações pré elos
  const amarracoes = Number(dPE?.pecasAmarracaoExt||0) + Number(dPE?.pecasAmarracaoInt||0);
  // seriais colagem
  const seriais = Number(dC?.seriaisGerados||0);
  // trat superfícies
  const pecasTrat = Number(dT?.pecasTratadas||0);
  // injeções fundição
  const pecasFund = Number(dF?.injetadasCera||0);

  const setoresAtivos=SETORES.filter(s=>dadosSetor(s.id)).length;

  return [
    {label:"Tags Etiquetadas",      value:n(dE?.tagsEtiquetadas),    icon:"🏷️", cor:"#ff5722"},
    {label:"Peças Banhadas",        value:n(pecasBanhadasTotal),      icon:"💧", cor:"#2196f3"},
    {label:"Peças Separadas",       value:n(dA?.separacao),           icon:"📦", cor:"#9c27b0"},
    {label:"Peças Conferidas",      value:n(dA?.conferencia),         icon:"✔️", cor:"#9c27b0"},
    {label:"Peças Contadas",        value:n(dA?.contagem),            icon:"🔢", cor:"#9c27b0"},
    {label:"Trat. Superfícies",     value:n(pecasTrat),               icon:"🧪", cor:"#ff6b9d"},
    {label:"Peso Ouro (g)",         value:n(pesoOuro),                icon:"🥇", cor:"#ffc107"},
    {label:"Peso Ródio (g)",        value:n(pesoRodio),               icon:"🩶", cor:"#90a4ae"},
    {label:"Peso Cataforético (g)", value:n(pesoCat),                 icon:"🛡️", cor:"#00bcd4"},
    {label:"Seriais Colados",       value:n(seriais),                 icon:"🔖", cor:"#795548"},
    {label:"Amarrações",            value:n(amarracoes),              icon:"🔗", cor:"#ff9800"},
    {label:"Injetadas Fundição",    value:n(pecasFund),               icon:"🔥", cor:"#e65100"},
    {label:"Perda Total (g)",       value:n(perdaTotal),              icon:"📉", cor:"#f44336"},
    {label:"Setores Ativos",        value:`${setoresAtivos}/${SETORES.length}`, icon:"🏭",cor:"#ff9800"},
  ];
}

//  RENDER ENGINE (vanilla JS)
// ══════════════════════════════════════════
function h(tag,attrs,children){
  const el=document.createElement(tag);
  if(attrs) Object.entries(attrs).forEach(([k,v])=>{
    if(k==="style"&&typeof v==="object") Object.assign(el.style,v);
    else if(k.startsWith("on")) el.addEventListener(k.slice(2).toLowerCase(),v);
    else if(k==="className") el.className=v;
    else if(k==="value"&&(tag==="input"||tag==="textarea")){el.value=v||"";}
    else if(k==="checked") el.checked=v;
    else if(k!=="key") el.setAttribute(k,v);
  });
  if(children){
    (Array.isArray(children)?children:[children]).forEach(c=>{
      if(c===null||c===undefined||c===false) return;
      el.appendChild(typeof c==="string"||typeof c==="number"?document.createTextNode(c):c);
    });
  }
  return el;
}

  else card.appendChild(h("div",{style:{height:"16px"}}));

  const podeEntrar=!!state.usuario;
  const btn=h("button",{style:{width:"100%",padding:"13px",background:podeEntrar?"#43a047":"#bbb",border:"none",borderRadius:"10px",color:"#fff",fontSize:"15px",fontWeight:"700",cursor:podeEntrar?"pointer":"default"},
    onClick:async()=>{
      if(!state.usuario) return;
      const senha=inpSenha.value;
      if(!senha) return;
      const h2=await hashStr(senha);
      if(h2===SENHA_HASH){
        setState({logado:true,senhaErro:false});
        carregarTudo();iniciarRealtime();
      } else {
        setState({senhaErro:true});
      }
    }
  },"Entrar no Sistema");
  card.appendChild(btn);
  card.appendChild(h("p",{style:{color:"#9ca3af",fontSize:"11px",marginTop:"24px"}},"Pink Heart · Veri · Sistema de Gestão Fundição"));
  wrap.appendChild(card);
  return wrap;
}

// ── APP ────────────────────────────────────
function renderApp(){
  const wrap=h("div",{style:{minHeight:"100vh",background:"#f3f4f6",color:"#111827",display:"flex"}});
  if(state.toast){
    const t=h("div",{style:{position:"fixed",bottom:"24px",left:"50%",transform:"translateX(-50%)",background:state.toast.tipo==="erro"?"#dc2626":"#15803d",color:"#fff",padding:"11px 22px",borderRadius:"10px",fontSize:"13px",fontWeight:"600",zIndex:"9999",boxShadow:"0 8px 32px rgba(0,0,0,0.3)",whiteSpace:"nowrap"}},state.toast.msg);
    wrap.appendChild(t);
  }
  // SIDEBAR
  wrap.appendChild(renderSidebar());
  // MAIN
  const main=h("div",{style:{flex:"1",minWidth:"0",display:"flex",flexDirection:"column"}});
  main.appendChild(renderTopbar());
  const content=h("div",{style:{flex:"1",overflow:"auto",padding:"0"}});
  if(state.aba==="dashboard") content.appendChild(renderDashboard());
  else if(state.aba==="setores") content.appendChild(renderSetores());
  else if(state.aba==="feed") content.appendChild(renderFeed());
  else if(state.aba==="planos") content.appendChild(renderPlanos());
  else if(state.aba==="historico") content.appendChild(renderHistorico());
  else if(state.aba==="relatorio") content.appendChild(renderRelatorio());
  else if(state.aba==="co_launch") content.appendChild(renderCOLaunch());
  else if(state.aba==="co_dashboard") content.appendChild(renderCODashboard());
  else if(state.aba==="co_logs") content.appendChild(renderCOLogs());
  content.appendChild(h("div",{style:{height:"32px"}}));
  main.appendChild(content);
  wrap.appendChild(main);
  return wrap;
}

      btn.appendChild(h("div",{style:{width:"3px",height:"16px",flexShrink:"0"}}));
    }
    btn.appendChild(h("span",{},item.label));
    btn.addEventListener("mouseenter",()=>{if(!isActive)btn.style.background="rgba(255,255,255,0.06)";});
    btn.addEventListener("mouseleave",()=>{if(!isActive)btn.style.background="transparent";});
    nav.appendChild(btn);
  });
  sb.appendChild(nav);

  // User area
  const userArea=h("div",{style:{padding:"12px 16px",borderTop:"1px solid rgba(255,255,255,0.07)"}});
  const userRow=h("div",{style:{display:"flex",alignItems:"center",gap:"8px"}});
  const av=h("div",{style:{width:"30px",height:"30px",borderRadius:"50%",background:"#43a047",display:"flex",alignItems:"center",justifyContent:"center",fontSize:"12px",fontWeight:"700",color:"#fff",flexShrink:"0"}},state.usuario.charAt(0));
  userRow.appendChild(av);
  const uname=h("div",{style:{flex:"1",minWidth:"0"}});
  uname.appendChild(h("div",{style:{color:"#e2e8f0",fontSize:"12px",fontWeight:"600",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}},state.usuario));
  userRow.appendChild(uname);
  userArea.appendChild(userRow);

  // Botões admin
  const usuariosAdmin=["Gerência","Coordenação"];
  if(usuariosAdmin.includes(state.usuario)){
    const adminBtns=h("div",{style:{marginTop:"10px",display:"flex",flexDirection:"column",gap:"4px"}});
    const btnSenha=h("button",{style:{width:"100%",padding:"6px 10px",background:"rgba(255,255,255,0.06)",border:"none",borderRadius:"6px",color:"var(--sidebar-text)",fontSize:"11px",cursor:"pointer",textAlign:"left"},
      onClick:()=>abrirTrocaSenha()},"🔑 Alterar Senha");
    const btnZerar=h("button",{style:{width:"100%",padding:"6px 10px",background:"rgba(220,38,38,0.12)",border:"none",borderRadius:"6px",color:"#f87171",fontSize:"11px",cursor:"pointer",textAlign:"left"},
      onClick:()=>confirmarZerar()},"🗑️ Zerar BD");
    adminBtns.appendChild(btnSenha);
    adminBtns.appendChild(btnZerar);
    userArea.appendChild(adminBtns);
  }
  sb.appendChild(userArea);
  return sb;
}

function renderTopbar(){
  const tb=h("div",{style:{background:"#fff",borderBottom:"1px solid #e5e7eb",padding:"12px 24px",display:"flex",alignItems:"center",justifyContent:"space-between",minHeight:"52px"}});
  const titles={dashboard:"Dashboard",setores:"Setores",feed:"Feed",planos:"Planos",historico:"Histórico",relatorio:"Relatório",co_launch:"Lançamentos Operacionais",co_dashboard:"Visão da Fábrica",co_logs:"Logs & Fechamento"};
  tb.appendChild(h("h1",{style:{fontSize:"17px",fontWeight:"700",color:"#111827"}},titles[state.aba]||""));
  const right=h("div",{style:{display:"flex",alignItems:"center",gap:"10px"}});
  const statusCfg={conectando:{txt:"Conectando...",cor:"#f59e0b"},online:{txt:"Conectado",cor:"#16a34a"},erro:{txt:"Erro",cor:"#dc2626"}}[state.dbStatus]||{txt:"...",cor:"#9ca3af"};
  const dot=h("div",{style:{display:"flex",alignItems:"center",gap:"5px",padding:"5px 12px",border:"1px solid #e5e7eb",borderRadius:"20px",fontSize:"12px",color:statusCfg.cor,fontWeight:"600"}});
  dot.appendChild(h("div",{style:{width:"7px",height:"7px",borderRadius:"50%",background:statusCfg.cor}}));
  dot.appendChild(h("span",{},statusCfg.txt));
  right.appendChild(dot);
  tb.appendChild(right);
  return tb;
}

    const tl=h("div",{}); tl.appendChild(iconBadge(setor,30)); tl.appendChild(h("div",{style:{color:setor.cor,fontWeight:"700",fontSize:"14px",marginTop:"4px"}},setor.nome));

    card.appendChild(top);

  return pg;

  }
  return grid;
}
