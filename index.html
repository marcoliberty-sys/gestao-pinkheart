const dataHoje = new Date().toISOString().split("T")[0];
// hash SHA-256 de "pink1234" — troque via botão no sistema
let SENHA_HASH = (()=>{try{return localStorage.getItem("ph_senha")||"c394033e2e04e0514c8e45cfea81a4c0d219b737a83ca71cf14c2d2e09c6da48";}catch(e){return "c394033e2e04e0514c8e45cfea81a4c0d219b737a83ca71cf14c2d2e09c6da48";}})();
async function hashStr(s){ const b=new TextEncoder().encode(s); const h=await crypto.subtle.digest("SHA-256",b); return Array.from(new Uint8Array(h)).map(x=>x.toString(16).padStart(2,"0")).join(""); }
const hoje = new Date().toLocaleDateString("pt-BR",{weekday:"long",day:"2-digit",month:"long",year:"numeric"});

// ══════════════════════════════════════════

let state = {
  aba: "dashboard",
  usuario: "",
  logado: false,
  dbStatus: "conectando",
  salvando: false,
  toast: null,
  producoes: {},
  feed: [],
  planos: [],

  form: {},
  novaMsg: "",
  tipoMsg: "update",
  comentando: null,
  textoComentario: "",

  // histórico

  chartInstance: null,
  // metas por setor (peças/dia)
  metas: {
    cadastros:0, almoxarifado:0, tratamento:0, inspecao:0, preelos:0,

  },

  senhaErro: false,

};

function setState(patch){
  Object.assign(state, typeof patch === "function" ? patch(state) : patch);
  render();
}

// ══════════════════════════════════════════
//  SUPABASE
// ══════════════════════════════════════════
async function carregarTudo(){
  setState({dbStatus:"conectando"});
  try {
    const [r1,r2,r3,r4] = await Promise.all([
      db.from("producoes").select("*").eq("data",dataHoje),
      db.from("feed").select("*").order("criado_em",{ascending:false}).limit(100),
      db.from("planos").select("*").order("criado_em",{ascending:false}),
      db.from("producoes").select("*").order("data",{ascending:false}),
    ]);
    const map={};
    (r1.data||[]).forEach(p=>{
      // campo "dados" é o JSONB com os campos do formulário
      // fallback: se não vier, tenta usar o próprio objeto menos os metadados
      if(p.dados && typeof p.dados === "object") {
        map[p.setor_id] = p.dados;
      } else {
        // tenta extrair campos úteis do objeto raiz
        const {id,setor_id,data,usuario,atualizado_em,...resto} = p;
        map[p.setor_id] = Object.keys(resto).length ? resto : {};
      }
    });
    console.log("📦 Producoes carregadas:", JSON.stringify(map).substring(0,500));
    setState({
      producoes:map,
      feed:r2.data||[],
      planos:r3.data||[],
      hist:r4.data||[],
      histCarregado:true,
      histCarregando:false,
      dbStatus:"online"
    });
  } catch(e){
    setState({dbStatus:"erro"});
    showToast("Erro ao conectar com o banco.","erro");
  }
}

function iniciarRealtime(){
  db.channel("pink-heart-rt")
    .on("postgres_changes",{event:"INSERT",schema:"public",table:"feed"}, p=>{
      setState(s=>({feed:[p.new,...s.feed]}));
    })
    .on("postgres_changes",{event:"UPDATE",schema:"public",table:"feed"}, p=>{
      setState(s=>({feed:s.feed.map(f=>f.id===p.new.id?p.new:f)}));
    })
    .on("postgres_changes",{event:"*",schema:"public",table:"producoes"}, p=>{
      if(p.new?.data===dataHoje)
        setState(s=>({producoes:{...s.producoes,[p.new.setor_id]:p.new.dados||p.new}}));
    })
    .subscribe();
}

let _carregandoHist = false;
async function carregarHistorico(){
  if(_carregandoHist) return;
  _carregandoHist = true;
  state.histCarregando = true;
  state.histCarregado = false;
  try{
    const {data, error}=await db.from("producoes").select("*").order("data",{ascending:false});
    if(error) throw error;
    state.hist = data||[];
    state.histCarregado = true;
    state.histCarregando = false;
    _carregandoHist = false;
    render();
  } catch(e){
    console.error("Erro histórico:",e);
    state.histCarregando = false;
    _carregandoHist = false;
    render();
    showToast("Erro: "+e.message,"erro");
  }
}

async function salvarProducao(setorId){
  setState({salvando:true});
  const dados={...state.form, savedAt:new Date().toISOString(), savedBy:state.usuario};
  try{
    const {error:e1}=await db.from("producoes").upsert(
      {setor_id:setorId,data:dataHoje,dados,usuario:state.usuario,atualizado_em:new Date().toISOString()},
      {onConflict:"setor_id,data"}
    );
    if(e1) throw e1;
    let txt="";
    const f=state.form;
    if(setorId==="cadastros")
      txt=`✅ Cadastros: 🏷️ SKUs: ${f.skusGeradas||0} | 📋 O.P's: ${f.opsGeradas||0} | 📐 Lista Técnica: ${f.listaTecnica||0} | 🗂️ Itens: ${f.cadastroItens||0}`;
    else if(setorId==="almoxarifado")
      txt=`✅ Almoxarifado: 📦 Sep: ${f.separacao||0} | ✔️ Conf: ${f.conferencia||0} | 🔢 Cont: ${f.contagem||0} | 🚚 Env: ${f.servicoExternoEnviado||0} | 📥 Rec: ${f.servicoExternoRecebido||0}`;
    else if(setorId==="etiquetagem")
      txt=`✅ Etiquetagem: 🏷️ Recebidas: ${f.tagsRecebidas||0} | ✅ Etiquetadas: ${f.tagsEtiquetadas||0} | ❌ Perdidas: ${f.tagsPerdidas||0}`;
    else
      txt=`✅ Produção: ${f.pecasProduzidas} peças | ${f.pesoBruto}g → ${f.pesoAposProcesso}g | Perda: ${f.perda}g | ${f.banho}`;
    await db.from("feed").insert({usuario:state.usuario,setor_id:setorId,tipo:"update",texto:txt,likes:0,comentarios:[],data:dataHoje,criado_em:new Date().toISOString()});
    setState(s=>{
      // atualizar ou inserir no hist local
      const jaExiste=s.hist.findIndex(r=>r.setor_id===setorId&&r.data===dataHoje);
      const novoReg={setor_id:setorId,data:dataHoje,dados,usuario:state.usuario,atualizado_em:new Date().toISOString()};
      const novoHist=jaExiste>=0?s.hist.map((r,i)=>i===jaExiste?{...r,...novoReg}:r):[novoReg,...s.hist];
      return {producoes:{...s.producoes,[setorId]:dados},hist:novoHist,setorAtivo:null,aba:"dashboard",salvando:false};
    });
    showToast("Produção salva com sucesso! ✅");
  } catch(e){
    setState({salvando:false});
    showToast("Erro ao salvar. Verifique a conexão.","erro");
  }
}

async function enviarMsg(){
  if(!state.novaMsg.trim()) return;
  const {data,error}=await db.from("feed").insert({usuario:state.usuario,setor_id:"geral",tipo:state.tipoMsg,texto:state.novaMsg,likes:0,comentarios:[],data:dataHoje,criado_em:new Date().toISOString()}).select().single();
  if(!error && data) setState(s=>({feed:[data,...s.feed],novaMsg:""}));
  else setState({novaMsg:""});
}

async function curtir(post){
  const likes=(post.likes||0)+1;
  await db.from("feed").update({likes}).eq("id",post.id);
  setState(s=>({feed:s.feed.map(f=>f.id===post.id?{...f,likes}:f)}));
}

async function enviarComentario(post){
  if(!state.textoComentario.trim()) return;
  const comentarios=[...(post.comentarios||[]),{u:state.usuario,t:state.textoComentario}];
  await db.from("feed").update({comentarios}).eq("id",post.id);
  setState(s=>({feed:s.feed.map(f=>f.id===post.id?{...f,comentarios}:f),textoComentario:"",comentando:null}));
}

async function salvarPlano(){
  if(!state.novoPlano.titulo) return;
  const {data,error}=await db.from("planos").insert({...state.novoPlano,criado_em:new Date().toISOString(),criado_por:state.usuario}).select().single();
  if(error){showToast("Erro ao salvar plano.","erro");return;}
  setState(s=>({planos:[data,...s.planos],novoPlano:{titulo:"",responsavel:"",prazo:"",descricao:"",status:"pendente",progresso:0},mostrarFormPlano:false}));
  showToast("Plano criado! 📋");
}

async function atualizarPlano(id,changes){
  await db.from("planos").update(changes).eq("id",id);
  setState(s=>({planos:s.planos.map(p=>p.id===id?{...p,...changes}:p)}));
}

function showToast(msg,tipo="ok"){
  setState({toast:{msg,tipo}});
  setTimeout(()=>setState({toast:null}),3500);

function dadosSetor(id){ return state.producoes[id]||null; }

function calcKpis(){
  // perdas consolidadas por setor
  let perdaTotal=0;
  const dE=dadosSetor("etiquetagem"), dG=dadosSetor("galvanoplastia"),
        dA=dadosSetor("almoxarifado"), dT=dadosSetor("tratamento"),
        dV=dadosSetor("verniz"),       dC=dadosSetor("colagem"),
        dP=dadosSetor("posbanho"),     dPE=dadosSetor("preelos"),
        dI=dadosSetor("inspecao"),     dF=dadosSetor("fundicao");

  // perda do tratamento: pecasPerdidas
  perdaTotal += Number(dT?.pesoPerdidas||0);
  // perda do pós banho: sucatas peso
  perdaTotal += Number(dP?.sucatasOuroPeso||0) + Number(dP?.sucatasRodioPeso||0);
  // perda pré elos: sucatas peso
  perdaTotal += Number(dPE?.sucatasOuroPeso||0) + Number(dPE?.sucatasRodioPeso||0);
  // perda verniz: campo perda genérico
  perdaTotal += Number(dV?.perda||0);

  // peças banhadas galvano
  const pecasBanhadasTotal = Number(dG?.pecasBanhadasOuro||0) + Number(dG?.pecasBanhadasRodio||0) + Number(dG?.pecasQuebec||0) + Number(dG?.pecasCataforetico||0);
  // peso ouro galvano
  const pesoOuro = Number(dG?.pesoBanhadoOuro||0);
  // peso ródio pós banho
  const pesoRodio = Number(dP?.pesoRevRodio||0);
  // peso cataforético galvano
  const pesoCat = Number(dG?.pesoCataforetico||0);
  // amarrações pré elos
  const amarracoes = Number(dPE?.pecasAmarracaoExt||0) + Number(dPE?.pecasAmarracaoInt||0);
  // seriais colagem
  const seriais = Number(dC?.seriaisGerados||0);
  // trat superfícies
  const pecasTrat = Number(dT?.pecasTratadas||0);
  // injeções fundição
  const pecasFund = Number(dF?.injetadasCera||0);

  const setoresAtivos=SETORES.filter(s=>dadosSetor(s.id)).length;

  return [
    {label:"Tags Etiquetadas",      value:n(dE?.tagsEtiquetadas),    icon:"🏷️", cor:"#ff5722"},
    {label:"Peças Banhadas",        value:n(pecasBanhadasTotal),      icon:"💧", cor:"#2196f3"},
    {label:"Peças Separadas",       value:n(dA?.separacao),           icon:"📦", cor:"#9c27b0"},
    {label:"Peças Conferidas",      value:n(dA?.conferencia),         icon:"✔️", cor:"#9c27b0"},
    {label:"Peças Contadas",        value:n(dA?.contagem),            icon:"🔢", cor:"#9c27b0"},
    {label:"Trat. Superfícies",     value:n(pecasTrat),               icon:"🧪", cor:"#ff6b9d"},
    {label:"Peso Ouro (g)",         value:n(pesoOuro),                icon:"🥇", cor:"#ffc107"},
    {label:"Peso Ródio (g)",        value:n(pesoRodio),               icon:"🩶", cor:"#90a4ae"},
    {label:"Peso Cataforético (g)", value:n(pesoCat),                 icon:"🛡️", cor:"#00bcd4"},
    {label:"Seriais Colados",       value:n(seriais),                 icon:"🔖", cor:"#795548"},
    {label:"Amarrações",            value:n(amarracoes),              icon:"🔗", cor:"#ff9800"},
    {label:"Injetadas Fundição",    value:n(pecasFund),               icon:"🔥", cor:"#e65100"},
    {label:"Perda Total (g)",       value:n(perdaTotal),              icon:"📉", cor:"#f44336"},
    {label:"Setores Ativos",        value:`${setoresAtivos}/${SETORES.length}`, icon:"🏭",cor:"#ff9800"},
  ];
}
function n(v){ return Number(v||0).toLocaleString("pt-BR"); }

// ══════════════════════════════════════════
//  RENDER ENGINE (vanilla JS)
// ══════════════════════════════════════════
function h(tag,attrs,children){
  const el=document.createElement(tag);
  if(attrs) Object.entries(attrs).forEach(([k,v])=>{
    if(k==="style"&&typeof v==="object") Object.assign(el.style,v);
    else if(k.startsWith("on")) el.addEventListener(k.slice(2).toLowerCase(),v);
    else if(k==="className") el.className=v;
    else if(k==="value"&&(tag==="input"||tag==="textarea")){el.value=v||"";}
    else if(k==="checked") el.checked=v;
    else if(k!=="key") el.setAttribute(k,v);
  });
  if(children){
    (Array.isArray(children)?children:[children]).forEach(c=>{
      if(c===null||c===undefined||c===false) return;
      el.appendChild(typeof c==="string"||typeof c==="number"?document.createTextNode(c):c);
    });
  }
  return el;
}

  const btn=h("button",{style:{width:"100%",padding:"13px",background:podeEntrar?"#43a047":"#bbb",border:"none",borderRadius:"10px",color:"#fff",fontSize:"15px",fontWeight:"700",cursor:podeEntrar?"pointer":"default"},
    onClick:async()=>{
      if(!state.usuario) return;
      const senha=inpSenha.value;
      if(!senha) return;
      const h2=await hashStr(senha);
      if(h2===SENHA_HASH){
        setState({logado:true,senhaErro:false});
        carregarTudo();iniciarRealtime();
      } else {
        setState({senhaErro:true});
      }
    }
  },"Entrar no Sistema");
  card.appendChild(btn);
  card.appendChild(h("p",{style:{color:"#9ca3af",fontSize:"11px",marginTop:"24px"}},"Pink Heart · Veri · Sistema de Gestão Fundição"));
  wrap.appendChild(card);
  return wrap;
}

// ── APP ────────────────────────────────────
function renderApp(){
  const wrap=h("div",{style:{minHeight:"100vh",background:"#f3f4f6",color:"#111827",display:"flex"}});
  if(state.toast){
    const t=h("div",{style:{position:"fixed",bottom:"24px",left:"50%",transform:"translateX(-50%)",background:state.toast.tipo==="erro"?"#dc2626":"#15803d",color:"#fff",padding:"11px 22px",borderRadius:"10px",fontSize:"13px",fontWeight:"600",zIndex:"9999",boxShadow:"0 8px 32px rgba(0,0,0,0.3)",whiteSpace:"nowrap"}},state.toast.msg);
    wrap.appendChild(t);
  }
  // SIDEBAR
  wrap.appendChild(renderSidebar());
  // MAIN
  const main=h("div",{style:{flex:"1",minWidth:"0",display:"flex",flexDirection:"column"}});
  main.appendChild(renderTopbar());
  const content=h("div",{style:{flex:"1",overflow:"auto",padding:"0"}});
  if(state.aba==="dashboard") content.appendChild(renderDashboard());
  else if(state.aba==="setores") content.appendChild(renderSetores());
  else if(state.aba==="feed") content.appendChild(renderFeed());
  else if(state.aba==="planos") content.appendChild(renderPlanos());
  else if(state.aba==="historico") content.appendChild(renderHistorico());
  else if(state.aba==="relatorio") content.appendChild(renderRelatorio());
  content.appendChild(h("div",{style:{height:"32px"}}));
  main.appendChild(content);
  wrap.appendChild(main);
  return wrap;
}

  const userRow=h("div",{style:{display:"flex",alignItems:"center",gap:"8px"}});
  const av=h("div",{style:{width:"30px",height:"30px",borderRadius:"50%",background:"#43a047",display:"flex",alignItems:"center",justifyContent:"center",fontSize:"12px",fontWeight:"700",color:"#fff",flexShrink:"0"}},state.usuario.charAt(0));
  userRow.appendChild(av);
  const uname=h("div",{style:{flex:"1",minWidth:"0"}});
  uname.appendChild(h("div",{style:{color:"#e2e8f0",fontSize:"12px",fontWeight:"600",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}},state.usuario));
  userRow.appendChild(uname);
  userArea.appendChild(userRow);

  // Botões admin
  const usuariosAdmin=["Gerência","Coordenação"];
  if(usuariosAdmin.includes(state.usuario)){
    const adminBtns=h("div",{style:{marginTop:"10px",display:"flex",flexDirection:"column",gap:"4px"}});
    const btnSenha=h("button",{style:{width:"100%",padding:"6px 10px",background:"rgba(255,255,255,0.06)",border:"none",borderRadius:"6px",color:"var(--sidebar-text)",fontSize:"11px",cursor:"pointer",textAlign:"left"},
      onClick:()=>abrirTrocaSenha()},"🔑 Alterar Senha");
    const btnZerar=h("button",{style:{width:"100%",padding:"6px 10px",background:"rgba(220,38,38,0.12)",border:"none",borderRadius:"6px",color:"#f87171",fontSize:"11px",cursor:"pointer",textAlign:"left"},
      onClick:()=>confirmarZerar()},"🗑️ Zerar BD");
    adminBtns.appendChild(btnSenha);
    adminBtns.appendChild(btnZerar);
    userArea.appendChild(adminBtns);
  }
  sb.appendChild(userArea);
  return sb;
}

function renderTopbar(){
  const tb=h("div",{style:{background:"#fff",borderBottom:"1px solid #e5e7eb",padding:"12px 24px",display:"flex",alignItems:"center",justifyContent:"space-between",minHeight:"52px"}});
  const titles={dashboard:"Dashboard",setores:"Setores",feed:"Feed",planos:"Planos",historico:"Histórico",relatorio:"Relatório"};
  tb.appendChild(h("h1",{style:{fontSize:"17px",fontWeight:"700",color:"#111827"}},titles[state.aba]||""));
  const right=h("div",{style:{display:"flex",alignItems:"center",gap:"10px"}});
  const statusCfg={conectando:{txt:"Conectando...",cor:"#f59e0b"},online:{txt:"Conectado",cor:"#16a34a"},erro:{txt:"Erro",cor:"#dc2626"}}[state.dbStatus]||{txt:"...",cor:"#9ca3af"};
  const dot=h("div",{style:{display:"flex",alignItems:"center",gap:"5px",padding:"5px 12px",border:"1px solid #e5e7eb",borderRadius:"20px",fontSize:"12px",color:statusCfg.cor,fontWeight:"600"}});
  dot.appendChild(h("div",{style:{width:"7px",height:"7px",borderRadius:"50%",background:statusCfg.cor}}));
  dot.appendChild(h("span",{},statusCfg.txt));
  right.appendChild(dot);
  tb.appendChild(right);
  return tb;
}

    const tl=h("div",{}); tl.appendChild(iconBadge(setor,30)); tl.appendChild(h("div",{style:{color:setor.cor,fontWeight:"700",fontSize:"14px",marginTop:"4px"}},setor.nome));

    card.appendChild(top);

  return pg;

  }
  return grid;
}

// ── FEED ───────────────────────────────────
function renderFeed(){
  const pg=h("div",{style:{padding:"20px",maxWidth:"700px",margin:"0 auto"},className:"fade-in"});
  pg.appendChild(h("h2",{style:{color:"#1a1a1a",margin:"0 0 20px"}},"💬 Feed da Equipe"));

  const caixa=h("div",{style:{background:"#fff",border:"1px solid rgba(233,30,140,0.3)",borderRadius:"16px",padding:"16px",marginBottom:"20px"}});
  const btns=h("div",{style:{display:"flex",gap:"8px",marginBottom:"12px",flexWrap:"wrap"}});
  Object.entries(TIPO_CONFIG).forEach(([key,cfg])=>{
    btns.appendChild(h("button",{style:{padding:"5px 12px",background:state.tipoMsg===key?cfg.cor:"#f0f0f0",border:"none",borderRadius:"20px",color:state.tipoMsg===key?"#fff":"#333",fontSize:"11px",cursor:"pointer",fontWeight:state.tipoMsg===key?"700":"400"},onClick:()=>setState({tipoMsg:key})},`${cfg.emoji} ${cfg.label}`));
  });
  caixa.appendChild(btns);
  const ta=h("textarea",{placeholder:"O que está acontecendo no seu setor?",style:{width:"100%",padding:"10px 14px",background:"#fff",border:"1px solid #e0e0e0",borderRadius:"10px",color:"#1a1a1a",fontSize:"14px",outline:"none",minHeight:"70px",resize:"none",boxSizing:"border-box"},onInput:e=>state.novaMsg=e.target.value});
  ta.value=state.novaMsg;
  caixa.appendChild(ta);
  const pub=h("div",{style:{display:"flex",justifyContent:"flex-end",marginTop:"8px"}});
  pub.appendChild(h("button",{style:{padding:"8px 20px",background:"#43a047",border:"none",borderRadius:"10px",color:"#fff",fontSize:"13px",cursor:"pointer",fontWeight:"700"},onClick:enviarMsg},"Publicar"));
  caixa.appendChild(pub);
  pg.appendChild(caixa);

  const lista=h("div",{style:{display:"flex",flexDirection:"column",gap:"12px"}});
  if(!state.feed.length) lista.appendChild(h("div",{style:{color:"var(--cinza3)",textAlign:"center",padding:"40px"}},"Nenhuma mensagem ainda hoje."));
  state.feed.forEach(post=>{
    const cfg=TIPO_CONFIG[post.tipo]||TIPO_CONFIG.update;
    const setor=SETORES.find(s=>s.id===post.setor_id);
    const card=h("div",{style:{background:"#fff",border:`1px solid ${cfg.cor}25`,borderRadius:"16px",padding:"16px"}});
    const top=h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:"10px"}});
    const av=h("div",{style:{display:"flex",alignItems:"center",gap:"10px"}});
    av.appendChild(h("div",{style:{width:"36px",height:"36px",borderRadius:"50%",background:`linear-gradient(135deg,${cfg.cor},#9c27b0)`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:"16px",fontWeight:"700"}},(post.usuario||"?").charAt(0)));
    const ui=h("div",{}); ui.appendChild(h("div",{style:{color:"var(--texto)",fontWeight:"600",fontSize:"13px"}},post.usuario));
    const hora=post.criado_em?new Date(post.criado_em).toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"}):"";
    ui.appendChild(h("div",{style:{color:"var(--cinza3)",fontSize:"11px"}},hora+(setor?` • ${setor.nome}`:"")));
    av.appendChild(ui); top.appendChild(av);
    top.appendChild(h("span",{style:{background:`${cfg.cor}20`,color:cfg.cor,fontSize:"10px",padding:"3px 8px",borderRadius:"8px",fontWeight:"700"}},`${cfg.emoji} ${cfg.label}`));
    card.appendChild(top);
    card.appendChild(h("p",{style:{color:"var(--texto)",fontSize:"14px",margin:"0 0 12px",lineHeight:"1.6"}},post.texto));
    const actions=h("div",{style:{display:"flex",gap:"12px",borderTop:"1px solid #e0e0e0",paddingTop:"10px"}});
    actions.appendChild(h("button",{style:{background:"none",border:"none",color:"var(--texto2)",cursor:"pointer",fontSize:"12px",padding:"0"},onClick:()=>curtir(post)},`❤️ ${post.likes||0}`));
    actions.appendChild(h("button",{style:{background:"none",border:"none",color:"var(--texto2)",cursor:"pointer",fontSize:"12px",padding:"0"},onClick:()=>setState({comentando:state.comentando===post.id?null:post.id})},`💬 ${(post.comentarios||[]).length} comentário${(post.comentarios||[]).length!==1?"s":""}`));
    card.appendChild(actions);
    if((post.comentarios||[]).length){
      const cl=h("div",{style:{marginTop:"10px",paddingLeft:"12px",borderLeft:"2px solid #e0e0e0"}});
      (post.comentarios||[]).forEach(c=>{const r=h("div",{style:{marginBottom:"6px"}});r.appendChild(h("span",{style:{color:"var(--verde)",fontSize:"12px",fontWeight:"600"}},c.u+": "));r.appendChild(h("span",{style:{color:"var(--texto2)",fontSize:"12px"}},c.t));cl.appendChild(r);});
      card.appendChild(cl);
    }
    if(state.comentando===post.id){
      const cr=h("div",{style:{marginTop:"10px",display:"flex",gap:"8px"}});
      const ci=h("input",{type:"text",placeholder:"Escreva um comentário...",style:{flex:"1",padding:"8px 12px",background:"#f5f5f5",border:"1px solid #e0e0e0",borderRadius:"8px",color:"#1a1a1a",fontSize:"12px",outline:"none"},onInput:e=>state.textoComentario=e.target.value});
      ci.value=state.textoComentario;
      cr.appendChild(ci);
      cr.appendChild(h("button",{style:{padding:"8px 14px",background:"#e91e8c",border:"none",borderRadius:"8px",color:"#fff",cursor:"pointer",fontSize:"12px"},onClick:()=>enviarComentario(post)},"→"));
      card.appendChild(cr);
    }
    lista.appendChild(card);
  });
  pg.appendChild(lista);
  return pg;
}

// ── PLANOS ─────────────────────────────────
function renderPlanos(){
  const pg=h("div",{style:{padding:"20px",maxWidth:"800px",margin:"0 auto"},className:"fade-in"});
  const top=h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"20px"}});
  top.appendChild(h("h2",{style:{color:"#1a1a1a",margin:"0"}},"📋 Planos de Ação"));
  top.appendChild(h("button",{style:{padding:"8px 16px",background:"#43a047",border:"none",borderRadius:"10px",color:"#fff",fontSize:"13px",cursor:"pointer",fontWeight:"700"},onClick:()=>setState({mostrarFormPlano:!state.mostrarFormPlano})},"+  Novo Plano"));
  pg.appendChild(top);

  if(state.mostrarFormPlano){
    const form=h("div",{style:{background:"#fff",border:"1px solid rgba(233,30,140,0.3)",borderRadius:"16px",padding:"20px",marginBottom:"20px"}});
    form.appendChild(h("h3",{style:{color:"#43a047",margin:"0 0 16px",fontSize:"16px"}},"Novo Plano de Ação"));
    const IS2={width:"100%",padding:"9px 12px",background:"#f5f5f5",border:"1px solid #e0e0e0",borderRadius:"8px",color:"#1a1a1a",fontSize:"13px",outline:"none",boxSizing:"border-box"};
    const LS2={color:"var(--texto2)",fontSize:"11px",display:"block",marginBottom:"5px",textTransform:"uppercase",letterSpacing:"1px"};
    const grid=h("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"12px"}});

    function pfld(label,key,type,ph,full){
      const w=h("div",{style:{gridColumn:full?"span 2":"auto"}});
      w.appendChild(h("label",{style:LS2},label));
      if(key==="descricao"){
        const ta=h("textarea",{placeholder:ph||"",style:{...IS2,minHeight:"60px",resize:"none"},onInput:e=>state.novoPlano[key]=e.target.value});
        ta.value=state.novoPlano[key]||""; w.appendChild(ta);
      } else {
        const el=h("input",{type:type||"text",placeholder:ph||"",style:IS2,onInput:e=>state.novoPlano[key]=e.target.value});
        el.value=state.novoPlano[key]||""; w.appendChild(el);
      }
      return w;
    }
    grid.appendChild(pfld("Título","titulo","text","ex: Reduzir perdas no tratamento",true));
    grid.appendChild(pfld("Responsável","responsavel","text","ex: Focal — Tratamento"));
    grid.appendChild(pfld("Prazo","prazo","date",""));
    grid.appendChild(pfld("Descrição","descricao","text","Descreva as ações...",true));
    form.appendChild(grid);
    const bts=h("div",{style:{display:"flex",gap:"8px",marginTop:"12px"}});
    bts.appendChild(h("button",{style:{padding:"8px 20px",background:"#43a047",border:"none",borderRadius:"8px",color:"#fff",cursor:"pointer",fontWeight:"700",fontSize:"13px"},onClick:salvarPlano},"Salvar Plano"));
    bts.appendChild(h("button",{style:{padding:"8px 16px",background:"#f5f5f5",border:"none",borderRadius:"8px",color:"var(--texto2)",cursor:"pointer",fontSize:"13px"},onClick:()=>setState({mostrarFormPlano:false})},"Cancelar"));
    form.appendChild(bts);
    pg.appendChild(form);
  }

  const lista=h("div",{style:{display:"flex",flexDirection:"column",gap:"12px"}});
  if(!state.planos.length) lista.appendChild(h("div",{style:{color:"var(--cinza3)",textAlign:"center",padding:"40px"}},"Nenhum plano cadastrado."));
  state.planos.forEach(plano=>{
    const cfg=STATUS_CONFIG[plano.status]||STATUS_CONFIG.pendente;
    const card=h("div",{style:{background:"#fff",border:`1px solid ${cfg.cor}30`,borderRadius:"16px",padding:"20px"}});
    const ct=h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:"12px"}});
    ct.appendChild(h("h3",{style:{color:"var(--texto)",margin:"0",fontSize:"16px"}},plano.titulo));
    const badges=h("div",{style:{display:"flex",gap:"8px",alignItems:"center"}});
    badges.appendChild(h("span",{style:{background:`${cfg.cor}20`,color:cfg.cor,fontSize:"11px",padding:"3px 10px",borderRadius:"8px",fontWeight:"700"}},cfg.label));
    const sel=h("select",{style:{padding:"4px 8px",background:"#f5f5f5",border:"1px solid #e0e0e0",borderRadius:"8px",color:"#1a1a1a",fontSize:"11px",cursor:"pointer",outline:"none"},onChange:e=>atualizarPlano(plano.id,{status:e.target.value})},Object.entries(STATUS_CONFIG).map(([k,v])=>h("option",{value:k,style:{background:"#f5f5f5"}},v.label)));
    sel.value=plano.status; badges.appendChild(sel); ct.appendChild(badges); card.appendChild(ct);
    card.appendChild(h("p",{style:{color:"var(--texto2)",fontSize:"13px",margin:"0 0 12px",lineHeight:"1.5"}},plano.descricao));
    const meta=h("div",{style:{display:"flex",gap:"20px",marginBottom:"12px",flexWrap:"wrap"}});
    if(plano.responsavel) meta.appendChild(h("span",{style:{color:"var(--texto2)",fontSize:"12px"}},`👤 ${plano.responsavel}`));
    if(plano.prazo) meta.appendChild(h("span",{style:{color:"var(--texto2)",fontSize:"12px"}},`📅 ${new Date(plano.prazo+"T12:00").toLocaleDateString("pt-BR")}`));
    if(plano.criado_por) meta.appendChild(h("span",{style:{color:"var(--cinza3)",fontSize:"12px"}},`✏️ ${plano.criado_por}`));
    card.appendChild(meta);
    const prog=h("div",{});
    const ph=h("div",{style:{display:"flex",justifyContent:"space-between",marginBottom:"5px"}});
    ph.appendChild(h("span",{style:{color:"var(--texto2)",fontSize:"11px"}},"Progresso"));
    ph.appendChild(h("span",{style:{color:cfg.cor,fontSize:"11px",fontWeight:"700"}},`${plano.progresso||0}%`));
    prog.appendChild(ph);
    const bar=h("div",{style:{background:"#eeeeee",borderRadius:"4px",height:"6px",cursor:"pointer"}});
    bar.addEventListener("click",e=>{const r=bar.getBoundingClientRect();const pct=Math.min(100,Math.max(0,Math.round(((e.clientX-r.left)/r.width)*100)));atualizarPlano(plano.id,{progresso:pct});});
    const fill=h("div",{style:{background:`linear-gradient(90deg,${cfg.cor},${cfg.cor}90)`,borderRadius:"4px",height:"100%",width:`${plano.progresso||0}%`,transition:"width 0.3s"}});
    bar.appendChild(fill); prog.appendChild(bar);
    prog.appendChild(h("div",{style:{color:"var(--cinza3)",fontSize:"10px",marginTop:"3px"}},"Clique na barra para atualizar progresso"));
    card.appendChild(prog);
    lista.appendChild(card);
  });
  pg.appendChild(lista);
  return pg;
}

// ── HISTÓRICO ──────────────────────────────
function renderHistorico(){
  const pg=h("div",{style:{padding:"20px",maxWidth:"1200px",margin:"0 auto"},className:"fade-in"});
  const histHead=h("div",{style:{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:"4px"}});
  histHead.appendChild(h("h2",{style:{color:"#1a1a1a",margin:"0",fontSize:"22px"}},"📅 Histórico de Produção"));
  const btnRecarregar=h("button",{style:{padding:"6px 14px",background:"#43a047",border:"none",borderRadius:"8px",color:"#fff",fontSize:"12px",fontWeight:"700",cursor:"pointer"},
    onClick:async()=>{
      btnRecarregar.textContent="⏳ Carregando...";
      btnRecarregar.disabled=true;
      try{
        const {data,error}=await db.from("producoes").select("*").order("data",{ascending:false});
        if(error) throw error;
        setState({hist:data||[],histCarregado:true});
        showToast("Histórico atualizado ✅");
      }catch(e){ showToast("Erro: "+e.message,"erro"); }
    }},"🔄 Recarregar");
  histHead.appendChild(btnRecarregar);
  pg.appendChild(histHead);
  pg.appendChild(h("p",{style:{color:"var(--texto2)",fontSize:"13px",marginBottom:"20px"}},"Todos os registros salvos no banco de dados"));

  if(!state.histCarregado){
    const load=h("div",{style:{textAlign:"center",padding:"80px 0"}});
    load.appendChild(h("div",{style:{fontSize:"40px",marginBottom:"16px"}},"⏳"));
    load.appendChild(h("div",{style:{color:"#555",fontSize:"15px"}},"Carregando..."));
    pg.appendChild(load);
    return pg;
  }

  // ── Filtros ──
  const filtros=h("div",{style:{background:"#fff",border:"1px solid var(--verde-borda)",borderRadius:"16px",padding:"16px",marginBottom:"20px",display:"flex",gap:"12px",flexWrap:"wrap",alignItems:"flex-end"}});
  const FS={padding:"8px 12px",background:"#f5f5f5",border:"1px solid rgba(255,255,255,0.15)",borderRadius:"8px",color:"#1a1a1a",fontSize:"13px",outline:"none",cursor:"pointer"};

  function fld(label,child){ const w=h("div",{}); w.appendChild(h("div",{style:{color:"var(--texto2)",fontSize:"11px",marginBottom:"5px",textTransform:"uppercase",letterSpacing:"1px"}},label)); w.appendChild(child); return w; }

  const selSetor=h("select",{style:FS,onChange:e=>setState({histFiltroSetor:e.target.value})},
    [h("option",{value:"todos"},"Todos os setores"),...SETORES.map(s=>h("option",{value:s.id},s.nome))]);
  selSetor.value=state.histFiltroSetor;
  filtros.appendChild(fld("Setor",selSetor));

  const di=h("input",{type:"date",style:FS,onChange:e=>setState({histDataInicio:e.target.value})}); di.value=state.histDataInicio;
  filtros.appendChild(fld("Data Início",di));
  const df=h("input",{type:"date",style:FS,onChange:e=>setState({histDataFim:e.target.value})}); df.value=state.histDataFim;
  filtros.appendChild(fld("Data Fim",df));

  filtros.appendChild(h("button",{style:{padding:"8px 16px",background:"#eeeeee",border:"1px solid rgba(255,255,255,0.15)",borderRadius:"8px",color:"var(--texto2)",fontSize:"13px",cursor:"pointer",marginTop:"auto"},
    onClick:()=>setState({histFiltroSetor:"todos",histDataInicio:"",histDataFim:""})},"✕ Limpar filtros"));

  filtros.appendChild(h("button",{style:{padding:"8px 16px",background:"#43a047",border:"none",borderRadius:"8px",color:"#fff",fontSize:"13px",cursor:"pointer",fontWeight:"700",marginTop:"auto"},
    onClick:()=>exportarCSV()},"⬇️ Exportar CSV"));
  pg.appendChild(filtros);

  // ── Dados filtrados ──
  let dados=[...state.hist];
  if(state.histFiltroSetor!=="todos") dados=dados.filter(r=>r.setor_id===state.histFiltroSetor);
  if(state.histDataInicio) dados=dados.filter(r=>r.data>=state.histDataInicio);
  if(state.histDataFim) dados=dados.filter(r=>r.data<=state.histDataFim);

  // ── KPIs de resumo ──
  const totalRegistros=dados.length;
  const diasUnicos=[...new Set(dados.map(r=>r.data))].length;
  const setoresUnicos=[...new Set(dados.map(r=>r.setor_id))].length;
  const totalPecas=dados.reduce((s,r)=>{
    const d=r.dados||{};
    const id=r.setor_id;
    if(id==="cadastros") return s+Number(d.skusGeradas||0)+Number(d.opsGeradas||0);
    if(id==="almoxarifado") return s+Number(d.separacao||0);
    if(id==="etiquetagem") return s+Number(d.tagsEtiquetadas||0);
    if(id==="tratamento") return s+Number(d.pecasTratadas||0);
    if(id==="inspecao") return s+Number(d.pecasInspecMontagens||0)+Number(d.pecasInspecSemi||0);
    if(id==="preelos") return s+Number(d.pecasAmarracaoExt||0)+Number(d.pecasAmarracaoInt||0);
    if(id==="posbanho") return s+Number(d.pecasRevOuro||0)+Number(d.pecasRevRodio||0);
    if(id==="galvanoplastia") return s+Number(d.pecasBanhadasOuro||0)+Number(d.pecasBanhadasRodio||0)+Number(d.pecasQuebec||0)+Number(d.pecasCataforetico||0);
    if(id==="colagem") return s+Number(d.seriaisGerados||0);
    if(id==="fundicao") return s+Number(d.injetadasCera||0);
    return s+Number(d.pecasProduzidas||0);
  },0);

  const krow=h("div",{style:{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(160px,1fr))",gap:"10px",marginBottom:"24px"}});
  [{label:"Total de Registros",value:totalRegistros,cor:"#e91e8c",icon:"📋"},
   {label:"Dias com Dados",value:diasUnicos,cor:"#9c27b0",icon:"📅"},
   {label:"Setores com Dados",value:setoresUnicos,cor:"#2196f3",icon:"🏭"},
   {label:"Total de Peças/Tags",value:totalPecas.toLocaleString("pt-BR"),cor:"#4caf50",icon:"📦"},
  ].forEach(k=>{
    const c=h("div",{style:{background:"#fff",border:"1px solid var(--borda)",borderRadius:"12px",padding:"14px",position:"relative",overflow:"hidden"}});
    c.appendChild(h("div",{style:{position:"absolute",top:"-10px",right:"-10px",fontSize:"36px",opacity:"0.07"}},k.icon));
    c.appendChild(h("div",{style:{color:"#555",fontSize:"10px",textTransform:"uppercase",letterSpacing:"1px",marginBottom:"5px"}},k.label));
    c.appendChild(h("div",{style:{color:"#43a047",fontSize:"24px",fontWeight:"700"}},k.value));
    krow.appendChild(c);
  });
  pg.appendChild(krow);

  // ── Gráfico de linha ──
  const graficoBox=h("div",{style:{background:"#fff",border:"1px solid var(--verde-borda)",borderRadius:"16px",padding:"20px",marginBottom:"20px"}});
  const gh=h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"16px",flexWrap:"wrap",gap:"8px"}});
  gh.appendChild(h("h3",{style:{color:"#43a047",margin:"0",fontSize:"15px"}},"📈 Produção ao Longo dos Dias"));
  const selGraf=h("select",{style:{padding:"6px 10px",background:"#f5f5f5",border:"1px solid rgba(255,255,255,0.15)",borderRadius:"8px",color:"#1a1a1a",fontSize:"12px",outline:"none"},
    onChange:e=>{setState({histGraficoSetor:e.target.value});setTimeout(()=>desenharGrafico(dados),50);}},
    SETORES.map(s=>h("option",{value:s.id,style:{background:"#f5f5f5"}},s.nome)));
  selGraf.value=state.histGraficoSetor;
  gh.appendChild(selGraf);
  graficoBox.appendChild(gh);
  const canvasWrap=h("div",{style:{position:"relative",height:"220px"}});
  const canvas=h("canvas",{id:"histChart"});
  canvasWrap.appendChild(canvas);
  graficoBox.appendChild(canvasWrap);
  pg.appendChild(graficoBox);
  setTimeout(()=>desenharGrafico(dados),100);

  // ── Comparativo entre setores ──
  const compBox=h("div",{style:{background:"#fff",border:"1px solid var(--verde-borda)",borderRadius:"16px",padding:"20px",marginBottom:"20px"}});
  compBox.appendChild(h("h3",{style:{color:"var(--verde2)",margin:"0 0 16px",fontSize:"15px"}},"⚖️ Comparativo Entre Setores"));
  const compGrid=h("div",{style:{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(200px,1fr))",gap:"10px"}});
  SETORES.forEach(setor=>{
    const regs=dados.filter(r=>r.setor_id===setor.id);
    if(!regs.length){ const c=h("div",{style:{background:"#fafafa",border:"1px solid #e0e0e0",borderRadius:"12px",padding:"14px",opacity:"0.6"}}); c.appendChild(h("div",{style:{display:"flex",alignItems:"center",gap:"8px",marginBottom:"8px"}},[h("span",{},setor.icon),h("span",{style:{color:"var(--texto2)",fontWeight:"700",fontSize:"13px"}},setor.nome)])); c.appendChild(h("div",{style:{color:"var(--cinza3)",fontSize:"12px"}},"Sem dados no período")); compGrid.appendChild(c); return; }
    const c=h("div",{style:{background:"#fff",border:`1px solid ${setor.cor}30`,borderRadius:"12px",padding:"14px"}});
    c.appendChild(h("div",{style:{display:"flex",alignItems:"center",gap:"8px",marginBottom:"10px"}},[h("span",{},setor.icon),h("span",{style:{color:setor.cor,fontWeight:"700",fontSize:"13px"}},setor.nome)]));

    let mainVal=0, mainLabel="";
    if(setor.id==="cadastros"){ mainVal=regs.reduce((s,r)=>s+Number(r.dados?.skusGeradas||0)+Number(r.dados?.opsGeradas||0)+Number(r.dados?.listaTecnica||0)+Number(r.dados?.cadastroItens||0),0); mainLabel="Total Lançamentos"; }
    else if(setor.id==="almoxarifado"){ mainVal=regs.reduce((s,r)=>s+Number(r.dados?.separacao||0),0); mainLabel="Total Separações"; }
    else if(setor.id==="etiquetagem"){ mainVal=regs.reduce((s,r)=>s+Number(r.dados?.tagsEtiquetadas||0),0); mainLabel="Tags Etiquetadas"; }
    else {
      const sid=setor.id;
      mainVal=regs.reduce((s,r)=>{
        const d=r.dados||{};
        if(sid==="tratamento") return s+Number(d.pecasTratadas||0);
        if(sid==="inspecao") return s+Number(d.pecasInspecMontagens||0)+Number(d.pecasInspecSemi||0);
        if(sid==="preelos") return s+Number(d.pecasAmarracaoExt||0)+Number(d.pecasAmarracaoInt||0);
        if(sid==="posbanho") return s+Number(d.pecasRevOuro||0)+Number(d.pecasRevRodio||0);
        if(sid==="galvanoplastia") return s+Number(d.pecasBanhadasOuro||0)+Number(d.pecasBanhadasRodio||0)+Number(d.pecasQuebec||0)+Number(d.pecasCataforetico||0);
        if(sid==="colagem") return s+Number(d.seriaisGerados||0);
        if(sid==="verniz") return s+Number(d.pecasProduzidas||0);
        if(sid==="fundicao") return s+Number(d.injetadasCera||0);
        return s+Number(d.pecasProduzidas||0);
      },0);
      mainLabel="Total Peças";
    }

    c.appendChild(h("div",{style:{marginBottom:"6px"}},[h("div",{style:{color:"var(--texto2)",fontSize:"10px",textTransform:"uppercase",letterSpacing:"1px"}},mainLabel),h("div",{style:{color:"var(--texto)",fontWeight:"700",fontSize:"20px"}},mainVal.toLocaleString("pt-BR"))]));
    c.appendChild(h("div",{style:{color:"var(--cinza3)",fontSize:"11px"}},`${regs.length} dia${regs.length!==1?"s":""} registrado${regs.length!==1?"s":""}`));
    compGrid.appendChild(c);
  });
  compBox.appendChild(compGrid);
  pg.appendChild(compBox);

  // ── Tabela detalhada ──
  const tabBox=h("div",{style:{background:"#fff",border:"1px solid var(--verde-borda)",borderRadius:"16px",padding:"20px",overflowX:"auto"}});
  tabBox.appendChild(h("h3",{style:{color:"var(--verde2)",margin:"0 0 16px",fontSize:"15px"}},`📋 Registros Detalhados (${dados.length})`));
  if(!dados.length){
    tabBox.appendChild(h("div",{style:{textAlign:"center",padding:"40px",color:"var(--cinza3)"}},"Nenhum registro encontrado para os filtros selecionados."));
  } else {
    const tab=h("table",{style:{width:"100%",borderCollapse:"collapse",fontSize:"13px"}});
    const thead=h("thead",{}); const tr=h("tr",{});
    ["Data","Setor","Registrado por","Principais Dados","Horário"].forEach(col=>{
      tr.appendChild(h("th",{style:{textAlign:"left",padding:"10px 12px",color:"var(--texto2)",fontSize:"11px",textTransform:"uppercase",letterSpacing:"1px",borderBottom:"1px solid rgba(255,255,255,0.08)"}},col));
    });
    thead.appendChild(tr); tab.appendChild(thead);
    const tbody=h("tbody",{});
    dados.forEach((reg,i)=>{
      const setor=SETORES.find(s=>s.id===reg.setor_id)||{nome:reg.setor_id,icon:"❓",cor:"#999"};
      const d=reg.dados||{};
      let resumo="";
      if(reg.setor_id==="cadastros")
        resumo=`SKUs:${d.skusGeradas||0} | OPs:${d.opsGeradas||0} | Lista:${d.listaTecnica||0} | Itens:${d.cadastroItens||0}`;
      else if(reg.setor_id==="almoxarifado")
        resumo=`Sep:${d.separacao||0} | Conf:${d.conferencia||0} | Cont:${d.contagem||0} | Env.Ext:${d.servicoExternoEnviado||0}`;
      else if(reg.setor_id==="etiquetagem")
        resumo=`Etiq:${d.tagsEtiquetadas||0} | Sucatas:${d.sucatasQuant||0} | P/Etiquetar:${d.tagsParaEtiquetar||0}`;
      else if(reg.setor_id==="tratamento")
        resumo=`Tratadas:${d.pecasTratadas||0} (${d.pesoTratadas||0}g) | Perdidas:${d.pecasPerdidas||0} | Limpas:${d.pecasLimpas||0} | Assist:${d.pecasAssistencias||0}`;
      else if(reg.setor_id==="inspecao")
        resumo=`Mont:${d.pecasInspecMontagens||0} (${d.pesoInspecMontagens||0}g) Perda:${d.perdasInspecMontagens||0} | Semi:${d.pecasInspecSemi||0} (${d.pesoInspecSemi||0}g) Perda:${d.perdasInspecSemi||0}`;
      else if(reg.setor_id==="preelos")
        resumo=`AmarrExt:${d.pecasAmarracaoExt||0} (${d.pesoAmarracaoExt||0}g) | Galvano:${d.pecasPrepGalvano||0} | AmarrInt:${d.pecasAmarracaoInt||0} | Prestadores:${d.previsaoEntregaQuant||0}`;
      else if(reg.setor_id==="galvanoplastia")
        resumo=`Ouro:${d.pecasBanhadasOuro||0} (${d.pesoBanhadoOuro||0}g) | Ródio:${d.pecasBanhadasRodio||0} (${d.pesoBanhadoRodio||0}g) | Quebec:${d.pecasQuebec||0} | Cat:${d.pecasCataforetico||0}`;
      else if(reg.setor_id==="posbanho"||reg.setor_id==="verniz"&&d.pecasRevOuro!==undefined)
        resumo=`RevOuro:${d.pecasRevOuro||0} (${d.pesoRevOuro||0}g) | RevRódio:${d.pecasRevRodio||0} | RetrabO:${d.retrabalhosOuro||0} | RetrabR:${d.retrabalhosRodio||0} | SucO:${d.sucatasOuroQuant||0} | SucR:${d.sucatasRodioQuant||0}`;
      else if(reg.setor_id==="colagem")
        resumo=`Gerados:${d.seriaisGerados||0} | Colagem:${d.colagemQuant||0} | Bipagem:${d.bipagemQuant||0} | Finalizados:${d.tagsFinalizadas||0} | Enviados:${d.tagsEnviadas||0}`;
      else if(reg.setor_id==="fundicao")
        resumo=`Injetadas:${d.injetadasCera||0} | Cravadas:${d.cravadasCera||0} | Pedras:${d.pedrasCravadas||0} | Árvores:${d.montagemArvores||0} | LixaInt:${d.lixaInterna||0} | LixaExt:${d.lixaExterna||0} | Turbo:${d.turbopolimento||0}`;
      else if(reg.setor_id==="verniz")
        resumo=`Peças:${d.pecasProduzidas||0} | Peso:${d.pesoBruto||0}g → ${d.pesoAposProcesso||0}g | Perda:${d.perda||0}g`;
      else
        resumo=`Peças:${d.pecasProduzidas||0} | Peso:${d.pesoBruto||0}g → ${d.pesoAposProcesso||0}g | Perda:${d.perda||0}g`;
      const hora=d.savedAt?new Date(d.savedAt).toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"}):"—";
      const row=h("tr",{style:{background:i%2===0?"rgba(255,255,255,0.01)":"transparent",borderBottom:"1px solid rgba(255,255,255,0.04)"}});
      const dataFmt=reg.data?new Date(reg.data+"T12:00").toLocaleDateString("pt-BR"):"—";
      row.appendChild(h("td",{style:{padding:"10px 12px",color:"#1a1a1a",fontWeight:"600"}},dataFmt));
      row.appendChild(h("td",{style:{padding:"10px 12px"}},h("span",{style:{background:`${setor.cor}20`,color:setor.cor,padding:"3px 8px",borderRadius:"6px",fontSize:"12px",fontWeight:"600"}},setor.nome)));
      row.appendChild(h("td",{style:{padding:"10px 12px",color:"var(--texto2)",fontSize:"12px"}},d.savedBy||"—"));
      row.appendChild(h("td",{style:{padding:"10px 12px",color:"var(--texto2)",fontSize:"12px",fontFamily:"monospace"}},resumo));
      row.appendChild(h("td",{style:{padding:"10px 12px",color:"var(--texto2)",fontSize:"12px"}},hora));
      tbody.appendChild(row);
    });
    tab.appendChild(tbody);
    tabBox.appendChild(tab);
  }
  pg.appendChild(tabBox);
  return pg;
}


// ══════════════════════════════════════════
//  RELATÓRIO EXECUTIVO DO DIA
// ══════════════════════════════════════════
function renderRelatorio(){
  const pg=h("div",{style:{padding:"20px",maxWidth:"1100px",margin:"0 auto"},className:"fade-in"});

  // ── Header do relatório ──
  const rHead=h("div",{style:{display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:"12px",marginBottom:"24px"}});
  const rTit=h("div",{});
  rTit.appendChild(h("h2",{style:{color:"#1a1a1a",margin:"0 0 4px",fontSize:"22px",fontWeight:"700"}},"Relatório Executivo do Dia"));
  rTit.appendChild(h("p",{style:{color:"var(--texto2)",fontSize:"13px",margin:"0"}},hoje+" — "+SETORES.filter(s=>state.producoes[s.id]).length+"/"+SETORES.length+" setores registraram"));
  rHead.appendChild(rTit);

  // seletor de data
  const dateSel=h("input",{type:"date",value:state.relatorioData||dataHoje,
    style:{padding:"8px 12px",border:"1px solid var(--borda)",borderRadius:"8px",fontSize:"13px",color:"#1a1a1a",background:"#fff",outline:"none",cursor:"pointer"},
    onChange:async e=>{
      const d=e.target.value;
      setState({relatorioData:d,relatorioFeedDia:null});
      // carregar feed do dia selecionado
      const {data}=await db.from("feed").select("*").gte("criado_em",d+"T00:00:00").lte("criado_em",d+"T23:59:59").order("criado_em",{ascending:true});
      setState({relatorioFeedDia:data||[]});
    }});
  rHead.appendChild(dateSel);

  // botão imprimir
  const btnPrint=h("button",{style:{padding:"8px 18px",background:"#1a1a1a",border:"none",borderRadius:"8px",color:"#fff",fontSize:"13px",fontWeight:"600",cursor:"pointer"},
    onClick:()=>window.print()},"↓ Imprimir / PDF");
  rHead.appendChild(btnPrint);
  pg.appendChild(rHead);

  // dados do dia do relatório
  const diaRel=state.relatorioData||dataHoje;
  const isHoje=diaRel===dataHoje;
  const feedDia=isHoje?state.feed:(state.relatorioFeedDia||[]);
  const prodDia={};
  if(isHoje){
    Object.keys(state.producoes).forEach(k=>prodDia[k]=state.producoes[k]);
  } else {
    state.hist.filter(r=>r.data===diaRel).forEach(r=>{ prodDia[r.setor_id]=r.dados; });
  }

  const setoresComDados=SETORES.filter(s=>prodDia[s.id]);
  const setoresSemDados=SETORES.filter(s=>!prodDia[s.id]);

  // ── Painel de alertas executivo ──
  const alertas=[];
  SETORES.forEach(s=>{
    const d=prodDia[s.id];
    if(!d){ alertas.push({setor:s,tipo:"sem_registro",nivel:"critico"}); return; }
    const meta=state.metas[s.id]||0;
    const perdaPct=calcPerdaSetor(s.id,d);
    if(perdaPct!==null&&perdaPct>10) alertas.push({setor:s,tipo:"perda_alta",nivel:"critico",extra:`${perdaPct.toFixed(1)}% de perda`});
    else if(perdaPct!==null&&perdaPct>5) alertas.push({setor:s,tipo:"perda_alta",nivel:"atencao",extra:`${perdaPct.toFixed(1)}% de perda`});
    if(meta>0){const prod=calcProducaoSetor(s.id,d);const pct=(prod/meta)*100;if(pct<50)alertas.push({setor:s,tipo:"abaixo_meta",nivel:"critico",extra:`${prod}/${meta} (${pct.toFixed(0)}%)`});else if(pct<100)alertas.push({setor:s,tipo:"abaixo_meta",nivel:"atencao",extra:`${prod}/${meta} (${pct.toFixed(0)}%)`});}
  });

  if(alertas.length){
    const ab=h("div",{style:{background:"#fff",border:"1px solid var(--borda)",borderRadius:"12px",padding:"16px 20px",marginBottom:"20px"}});
    ab.appendChild(h("div",{style:{fontWeight:"700",fontSize:"13px",color:"#1a1a1a",marginBottom:"12px",letterSpacing:"0.3px",textTransform:"uppercase"}},"⚡ Pontos de Atenção"));
    const ag=h("div",{style:{display:"flex",flexWrap:"wrap",gap:"8px"}});
    alertas.forEach(a=>{
      const cor=a.nivel==="critico"?"#f44336":"#ff9800";
      const chip=h("div",{style:{background:cor+"10",border:`1px solid ${cor}40`,borderRadius:"6px",padding:"5px 10px",fontSize:"12px",color:cor,fontWeight:"600",display:"flex",alignItems:"center",gap:"6px"}});
      chip.appendChild(iconBadge(a.setor,18));
      chip.appendChild(document.createTextNode(
        a.tipo==="sem_registro"?" Sem registro":
        a.tipo==="perda_alta"?` Perda ${a.extra}`:
        ` Meta ${a.extra}`
      ));
      ag.appendChild(chip);
    });
    ab.appendChild(ag);
    pg.appendChild(ab);
  }

  // ── Cards por setor ──
  setoresComDados.forEach(setor=>{
    const d=prodDia[setor.id];
    const feedSetor=feedDia.filter(f=>f.setor_id===setor.id);
    const dificuldades=feedSetor.filter(f=>f.tipo==="dificuldade");
    const sugestoes=feedSetor.filter(f=>f.tipo==="sugestao");
    const conquistas=feedSetor.filter(f=>f.tipo==="conquista");
    const avisos=feedSetor.filter(f=>f.tipo==="aviso");
    const updates=feedSetor.filter(f=>f.tipo==="update");

    const card=h("div",{style:{background:"#fff",border:"1px solid var(--borda)",borderRadius:"12px",marginBottom:"16px",overflow:"hidden"}});

    // cabeçalho do card
    const cardHead=h("div",{style:{display:"flex",alignItems:"center",gap:"12px",padding:"14px 20px",borderBottom:"1px solid var(--borda)",background:`${setor.cor}08`}});
    cardHead.appendChild(iconBadge(setor,32));
    const headInfo=h("div",{style:{flex:"1"}});
    headInfo.appendChild(h("div",{style:{fontWeight:"700",fontSize:"15px",color:"#1a1a1a"}},setor.nome));
    const meta=state.metas[setor.id]||0;
    const prod=calcProducaoSetor(setor.id,d);
    const perdaPct=calcPerdaSetor(setor.id,d);
    const metaStr=meta>0?`${prod} / ${meta} peças — ${((prod/meta)*100).toFixed(0)}%`:`${prod} registros`;
    headInfo.appendChild(h("div",{style:{fontSize:"12px",color:"var(--texto2)",marginTop:"2px"}},metaStr+(perdaPct!==null?` · Perda: ${perdaPct.toFixed(1)}%`:"")));
    cardHead.appendChild(headInfo);

    // badge status
    const temGargalo=alertas.find(a=>a.setor.id===setor.id);
    const statusBadge=h("span",{style:{
      padding:"4px 10px",borderRadius:"6px",fontSize:"11px",fontWeight:"700",
      background:temGargalo?(temGargalo.nivel==="critico"?"#fef2f2":"#fffbeb"):"#f0fdf4",
      color:temGargalo?(temGargalo.nivel==="critico"?"#dc2626":"#d97706"):"#16a34a"
    }},temGargalo?(temGargalo.nivel==="critico"?"CRÍTICO":"ATENÇÃO"):"OK");
    cardHead.appendChild(statusBadge);
    card.appendChild(cardHead);

    // corpo: dados + feed
    const body=h("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"0"}});

    // coluna esquerda: dados de produção
    const colDados=h("div",{style:{padding:"16px 20px",borderRight:"1px solid var(--borda)"}});
    colDados.appendChild(h("div",{style:{fontSize:"11px",fontWeight:"700",color:"var(--texto2)",textTransform:"uppercase",letterSpacing:"0.5px",marginBottom:"10px"}},"Dados de Produção"));
    const dadosGrid=h("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"6px"}});
    buildDadosResumo(setor.id,d).forEach(({label,value})=>{
      const item=h("div",{style:{background:"var(--cinza)",borderRadius:"6px",padding:"8px 10px"}});
      item.appendChild(h("div",{style:{fontSize:"10px",color:"var(--texto2)",marginBottom:"2px"}},label));
      item.appendChild(h("div",{style:{fontSize:"14px",fontWeight:"700",color:"#1a1a1a"}},String(value)));
      dadosGrid.appendChild(item);
    });
    colDados.appendChild(dadosGrid);
    if(d.observacoes){
      colDados.appendChild(h("div",{style:{marginTop:"10px",background:"#fffbeb",border:"1px solid #fde68a",borderRadius:"6px",padding:"8px 10px",fontSize:"12px",color:"#92400e"}},"📝 "+d.observacoes));
    }
    body.appendChild(colDados);

    // coluna direita: feed do dia
    const colFeed=h("div",{style:{padding:"16px 20px"}});
    colFeed.appendChild(h("div",{style:{fontSize:"11px",fontWeight:"700",color:"var(--texto2)",textTransform:"uppercase",letterSpacing:"0.5px",marginBottom:"10px"}},"Registros do Dia"));

    if(!feedSetor.length){
      colFeed.appendChild(h("div",{style:{color:"var(--cinza3)",fontSize:"12px",fontStyle:"italic"}},"Nenhuma comunicação registrada."));
    } else {
      const catOrder=[
        {key:"dificuldade",label:"Dificuldades",cor:"#dc2626",bg:"#fef2f2"},
        {key:"conquista",  label:"Êxitos",      cor:"#16a34a",bg:"#f0fdf4"},
        {key:"sugestao",   label:"Sugestões",   cor:"#d97706",bg:"#fffbeb"},
        {key:"aviso",      label:"Avisos",      cor:"#7c3aed",bg:"#faf5ff"},
        {key:"update",     label:"Atualizações",cor:"#2563eb",bg:"#eff6ff"},
      ];
      catOrder.forEach(cat=>{
        const itens=feedSetor.filter(f=>f.tipo===cat.key);
        if(!itens.length) return;
        const sec=h("div",{style:{marginBottom:"8px"}});
        sec.appendChild(h("div",{style:{fontSize:"10px",fontWeight:"700",color:cat.cor,textTransform:"uppercase",letterSpacing:"0.5px",marginBottom:"4px"}},cat.label));
        itens.forEach(f=>{
          const fItem=h("div",{style:{background:cat.bg,border:`1px solid ${cat.cor}25`,borderRadius:"6px",padding:"7px 10px",marginBottom:"4px",fontSize:"12px",color:"#1a1a1a",lineHeight:"1.4"}},f.texto);
          // comentários
          if(f.comentarios&&f.comentarios.length){
            f.comentarios.forEach(c=>{
              const cr=h("div",{style:{marginTop:"4px",paddingLeft:"10px",borderLeft:`2px solid ${cat.cor}50`,fontSize:"11px",color:"var(--texto2)"}},`${c.u}: ${c.t}`);
              fItem.appendChild(cr);
            });
          }
          sec.appendChild(fItem);
        });
        colFeed.appendChild(sec);
      });
    }
    body.appendChild(colFeed);
    card.appendChild(body);
    pg.appendChild(card);
  });

  // ── Setores sem registro ──
  if(setoresSemDados.length){
    const semBox=h("div",{style:{background:"#fff",border:"1px solid #fee2e2",borderRadius:"12px",padding:"16px 20px",marginBottom:"16px"}});
    semBox.appendChild(h("div",{style:{fontSize:"11px",fontWeight:"700",color:"#dc2626",textTransform:"uppercase",letterSpacing:"0.5px",marginBottom:"10px"}},"Setores Sem Registro"));
    const semGrid=h("div",{style:{display:"flex",flexWrap:"wrap",gap:"8px"}});
    setoresSemDados.forEach(s=>{
      const chip=h("div",{style:{background:"#fef2f2",border:"1px solid #fecaca",borderRadius:"6px",padding:"5px 10px",display:"flex",alignItems:"center",gap:"6px"}});
      chip.appendChild(iconBadge(s,18));
      chip.appendChild(h("span",{style:{fontSize:"12px",color:"#dc2626",fontWeight:"600"}},s.nome));
      semGrid.appendChild(chip);
    });
    semBox.appendChild(semGrid);
    pg.appendChild(semBox);
  }

  return pg;
}

// ── Dados resumidos por setor para o relatório ──
function buildDadosResumo(id,d){
  if(id==="cadastros") return [{label:"SKUs",value:d.skusGeradas||0},{label:"O.P's",value:d.opsGeradas||0},{label:"Lista Técnica",value:d.listaTecnica||0},{label:"Itens",value:d.cadastroItens||0}];
  if(id==="almoxarifado") return [{label:"Separação",value:d.separacao||0},{label:"Conferência",value:d.conferencia||0},{label:"Contagem",value:d.contagem||0},{label:"Env. Externo",value:d.servicoExternoEnviado||0}];
  if(id==="tratamento") return [{label:"Tratadas",value:`${d.pecasTratadas||0} (${d.pesoTratadas||0}g)`},{label:"Perdidas",value:`${d.pecasPerdidas||0} (${d.pesoPerdidas||0}g)`},{label:"Limpas",value:d.pecasLimpas||0},{label:"Assistências",value:d.pecasAssistencias||0}];
  if(id==="inspecao") return [{label:"Insp. Mont.",value:`${d.pecasInspecMontagens||0} (${d.pesoInspecMontagens||0}g)`},{label:"Perda Mont.",value:d.perdasInspecMontagens||0},{label:"Insp. Semi",value:`${d.pecasInspecSemi||0} (${d.pesoInspecSemi||0}g)`},{label:"Perda Semi",value:d.perdasInspecSemi||0}];
  if(id==="preelos") return [{label:"Amarr. Ext.",value:`${d.pecasAmarracaoExt||0} (${d.pesoAmarracaoExt||0}g)`},{label:"Prep. Galvano",value:d.pecasPrepGalvano||0},{label:"Amarr. Int.",value:d.pecasAmarracaoInt||0},{label:"Prev. Entrega",value:d.previsaoEntregaQuant||0}];
  if(id==="galvanoplastia") return [{label:"Ban. Ouro",value:`${d.pecasBanhadasOuro||0} (${d.pesoBanhadoOuro||0}g)`},{label:"Ban. Ródio",value:`${d.pecasBanhadasRodio||0} (${d.pesoBanhadoRodio||0}g)`},{label:"Quebec",value:`${d.pecasQuebec||0} (${d.pesoQuebec||0}g)`},{label:"E-Coat",value:`${d.pecasCataforetico||0} (${d.pesoCataforetico||0}g)`}];
  if(id==="verniz") return [{label:"Peças",value:d.pecasProduzidas||0},{label:"Peso entrada",value:`${d.pesoBruto||0}g`},{label:"Peso saída",value:`${d.pesoAposProcesso||0}g`},{label:"Perda",value:`${d.perda||0}g`}];
  if(id==="posbanho") return [{label:"Rev. Ouro",value:`${d.pecasRevOuro||0} (${d.pesoRevOuro||0}g)`},{label:"Rev. Ródio",value:`${d.pecasRevRodio||0} (${d.pesoRevRodio||0}g)`},{label:"Sucatas Ouro",value:`${d.sucatasOuroQuant||0} (${d.sucatasOuroPeso||0}g)`},{label:"Sucatas Ródio",value:`${d.sucatasRodioQuant||0} (${d.sucatasRodioPeso||0}g)`}];
  if(id==="etiquetagem") return [{label:"Etiquetadas",value:d.tagsEtiquetadas||0},{label:"Sucatas",value:d.sucatasQuant||0},{label:"Para Etiquetar",value:d.tagsParaEtiquetar||0}];
  if(id==="colagem") return [{label:"Seriais Gerados",value:d.seriaisGerados||0},{label:"Colagem",value:d.colagemQuant||0},{label:"Bipagem",value:d.bipagemQuant||0},{label:"Enviados",value:d.tagsEnviadas||0}];
  if(id==="fundicao") return [{label:"Injetadas",value:d.injetadasCera||0},{label:"Cravadas",value:d.cravadasCera||0},{label:"Árvores",value:d.montagemArvores||0},{label:"Turbopol.",value:d.turbopolimento||0}];
  return [];
}

function desenharGrafico(dados){
  const canvas=document.getElementById("histChart");
  if(!canvas) return;
  if(state.chartInstance){ state.chartInstance.destroy(); state.chartInstance=null; }
  const setorId=state.histGraficoSetor;
  const setor=SETORES.find(s=>s.id===setorId)||SETORES[5];
  const regs=dados.filter(r=>r.setor_id===setorId).sort((a,b)=>a.data>b.data?1:-1);

  const labels=regs.map(r=>new Date(r.data+"T12:00").toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit"}));
  let values=[];
  if(setorId==="cadastros") values=regs.map(r=>Number(r.dados?.skusGeradas||0)+Number(r.dados?.opsGeradas||0)+Number(r.dados?.listaTecnica||0)+Number(r.dados?.cadastroItens||0));
  else if(setorId==="almoxarifado") values=regs.map(r=>Number(r.dados?.separacao||0));
  else if(setorId==="etiquetagem") values=regs.map(r=>Number(r.dados?.tagsEtiquetadas||0));
  else values=regs.map(r=>{
    const d=r.dados||{};
    if(setorId==="etiquetagem") return Number(d.tagsEtiquetadas||0);
    if(setorId==="almoxarifado") return Number(d.separacao||0);
    if(setorId==="cadastros") return Number(d.skusGeradas||0)+Number(d.opsGeradas||0);
    if(setorId==="tratamento") return Number(d.pecasTratadas||0);
    if(setorId==="inspecao") return Number(d.pecasInspecMontagens||0)+Number(d.pecasInspecSemi||0);
    if(setorId==="preelos") return Number(d.pecasAmarracaoExt||0)+Number(d.pecasAmarracaoInt||0);
    if(setorId==="posbanho") return Number(d.pecasRevOuro||0)+Number(d.pecasRevRodio||0);
    if(setorId==="galvanoplastia") return Number(d.pecasBanhadasOuro||0)+Number(d.pecasBanhadasRodio||0)+Number(d.pecasQuebec||0)+Number(d.pecasCataforetico||0);
    if(setorId==="colagem") return Number(d.seriaisGerados||0);
    if(setorId==="fundicao") return Number(d.injetadasCera||0);
    return Number(d.pecasProduzidas||0);
  });

  if(!labels.length){ canvas.getContext("2d").clearRect(0,0,canvas.width,canvas.height); return; }

  const chart=new Chart(canvas,{
    type:"line",
    data:{
      labels,
      datasets:[{
        label:setor.nome,
        data:values,
        borderColor:setor.cor,
        backgroundColor:setor.cor+"20",
        borderWidth:2,
        pointBackgroundColor:setor.cor,
        pointRadius:4,
        fill:true,
        tension:0.4,
      }]
    },
    options:{
      responsive:true,
      maintainAspectRatio:false,
      plugins:{legend:{labels:{color:"var(--texto2)",font:{size:12}}},tooltip:{backgroundColor:"rgba(15,8,21,0.95)",titleColor:"#fff",bodyColor:"rgba(255,255,255,0.7)",borderColor:setor.cor,borderWidth:1}},
      scales:{
        x:{ticks:{color:"var(--texto2)",font:{size:11}},grid:{color:"rgba(255,255,255,0.05)"}},
        y:{ticks:{color:"var(--texto2)",font:{size:11}},grid:{color:"rgba(255,255,255,0.05)"},beginAtZero:true},
      }
    }
  });
  state.chartInstance=chart;
}

function exportarCSV(){
  let dados=[...state.hist];
  if(state.histFiltroSetor!=="todos") dados=dados.filter(r=>r.setor_id===state.histFiltroSetor);
  if(state.histDataInicio) dados=dados.filter(r=>r.data>=state.histDataInicio);
  if(state.histDataFim) dados=dados.filter(r=>r.data<=state.histDataFim);

  const linhas=[["Data","Setor","Registrado por","Peças/Tags","Peso Bruto (g)","Peso Final (g)","Perda (g)","Tipo Banho","Turno","Observações","Horário"]];
  dados.forEach(reg=>{
    const setor=SETORES.find(s=>s.id===reg.setor_id)||{nome:reg.setor_id};
    const d=reg.dados||{};
    let pecas="";
    if(reg.setor_id==="cadastros") pecas=Number(d.skusGeradas||0)+Number(d.opsGeradas||0)+Number(d.listaTecnica||0)+Number(d.cadastroItens||0);
    else if(reg.setor_id==="almoxarifado") pecas=d.separacao||0;
    else if(reg.setor_id==="etiquetagem") pecas=d.tagsEtiquetadas||0;
    else if(reg.setor_id==="tratamento") pecas=d.pecasTratadas||0;
    else if(reg.setor_id==="inspecao") pecas=Number(d.pecasInspecMontagens||0)+Number(d.pecasInspecSemi||0);
    else if(reg.setor_id==="preelos") pecas=Number(d.pecasAmarracaoExt||0)+Number(d.pecasAmarracaoInt||0);
    else if(reg.setor_id==="posbanho") pecas=Number(d.pecasRevOuro||0)+Number(d.pecasRevRodio||0);
    else if(reg.setor_id==="galvanoplastia") pecas=Number(d.pecasBanhadasOuro||0)+Number(d.pecasBanhadasRodio||0)+Number(d.pecasQuebec||0)+Number(d.pecasCataforetico||0);
    else if(reg.setor_id==="colagem") pecas=d.seriaisGerados||0;
    else if(reg.setor_id==="fundicao") pecas=d.injetadasCera||0;
    else pecas=d.pecasProduzidas||0;
    const hora=d.savedAt?new Date(d.savedAt).toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"}):"";
    linhas.push([reg.data,setor.nome,d.savedBy||"",pecas,d.pesoBruto||"",d.pesoAposProcesso||"",d.perda||"",d.banho||"",d.turno||"",`"${(d.observacoes||"").replace(/"/g,"'")}"`,hora]);
  });
  const csv=linhas.map(l=>l.join(";")).join("\n");
  const blob=new Blob(["\uFEFF"+csv],{type:"text/csv;charset=utf-8;"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a"); a.href=url;
  a.download=`pink-heart-producao-${new Date().toISOString().split("T")[0]}.csv`;
  a.click(); URL.revokeObjectURL(url);
  showToast("CSV exportado com sucesso! ✅");
}

function abrirTrocaSenha(){
  const overlay=h("div",{style:{position:"fixed",inset:"0",background:"rgba(0,0,0,0.6)",zIndex:"9999",display:"flex",alignItems:"center",justifyContent:"center",padding:"20px"}});
  const modal=h("div",{style:{background:"#fff",borderRadius:"20px",padding:"32px 28px",maxWidth:"380px",width:"100%",boxShadow:"0 20px 60px rgba(0,0,0,0.3)"}});
  modal.appendChild(h("div",{style:{fontSize:"40px",textAlign:"center",marginBottom:"12px"}},"🔑"));
  modal.appendChild(h("h2",{style:{color:"#1a1a1a",textAlign:"center",margin:"0 0 8px",fontSize:"18px"}},"Alterar Senha de Acesso"));
  modal.appendChild(h("p",{style:{color:"#666",fontSize:"13px",textAlign:"center",margin:"0 0 20px"}},"A nova senha valerá para todos os usuários."));

  const mkField=(label,ph,id)=>{
    const w=h("div",{style:{marginBottom:"14px"}});
    w.appendChild(h("label",{style:{fontSize:"12px",color:"#555",display:"block",marginBottom:"4px"}},label));
    const inp=h("input",{type:"password",placeholder:ph,id,
      style:{width:"100%",padding:"10px 14px",border:"1px solid #ccc",borderRadius:"10px",fontSize:"14px",color:"#1a1a1a",outline:"none",boxSizing:"border-box"}});
    w.appendChild(inp);
    return w;
  };
  modal.appendChild(mkField("Senha atual","Digite a senha atual","ts_atual"));
  modal.appendChild(mkField("Nova senha","Mínimo 6 caracteres","ts_nova"));
  modal.appendChild(mkField("Confirmar nova senha","Repita a nova senha","ts_conf"));

  const msg=h("p",{style:{color:"#f44336",fontSize:"12px",minHeight:"18px",margin:"0 0 12px"}});
  modal.appendChild(msg);

  const btns=h("div",{style:{display:"flex",gap:"10px"}});
  btns.appendChild(h("button",{style:{flex:"1",padding:"11px",background:"#f0f0f0",border:"none",borderRadius:"10px",color:"#333",fontWeight:"700",fontSize:"14px",cursor:"pointer"},
    onClick:()=>document.body.removeChild(overlay)},"Cancelar"));
  btns.appendChild(h("button",{style:{flex:"1",padding:"11px",background:"#43a047",border:"none",borderRadius:"10px",color:"#fff",fontWeight:"700",fontSize:"14px",cursor:"pointer"},
    onClick:async()=>{
      const atual=document.getElementById("ts_atual").value;
      const nova=document.getElementById("ts_nova").value;
      const conf=document.getElementById("ts_conf").value;
      const hAtual=await hashStr(atual);
      if(hAtual!==SENHA_HASH){ msg.textContent="Senha atual incorreta."; return; }
      if(nova.length<6){ msg.textContent="A nova senha precisa ter ao menos 6 caracteres."; return; }
      if(nova!==conf){ msg.textContent="As senhas não coincidem."; return; }
      const hNova=await hashStr(nova);
      SENHA_HASH=hNova;
      try{localStorage.setItem("ph_senha",hNova);}catch(e){}
      document.body.removeChild(overlay);
      showToast("✅ Senha alterada com sucesso!");
    }},"Salvar"));
  modal.appendChild(btns);
  overlay.addEventListener("click",e=>{if(e.target===overlay)document.body.removeChild(overlay);});
  document.body.appendChild(overlay);
}

function confirmarZerar(){
  // Modal de dupla confirmação
  const overlay=h("div",{style:{position:"fixed",inset:"0",background:"rgba(0,0,0,0.6)",zIndex:"9999",display:"flex",alignItems:"center",justifyContent:"center",padding:"20px"}});

  const modal=h("div",{style:{background:"#fff",borderRadius:"20px",padding:"32px 28px",maxWidth:"420px",width:"100%",boxShadow:"0 20px 60px rgba(0,0,0,0.3)"}});

  modal.appendChild(h("div",{style:{fontSize:"48px",textAlign:"center",marginBottom:"12px"}},"⚠️"));
  modal.appendChild(h("h2",{style:{color:"#b71c1c",textAlign:"center",margin:"0 0 8px",fontSize:"20px"}},"Zerar Banco de Dados"));
  modal.appendChild(h("p",{style:{color:"#555",textAlign:"center",fontSize:"14px",margin:"0 0 20px",lineHeight:"1.5"}},"Esta ação irá apagar permanentemente <strong>todas as produções, feed e planos</strong>. Esta operação <strong>não pode ser desfeita</strong>."));

  // campo de confirmação por senha
  modal.appendChild(h("p",{style:{color:"#333",fontSize:"13px",fontWeight:"600",marginBottom:"6px"}},'Digite <span style="color:#b71c1c">CONFIRMAR</span> para prosseguir:'));
  const inp=h("input",{type:"text",placeholder:"Digite CONFIRMAR",
    style:{width:"100%",padding:"10px 14px",border:"2px solid #f44336",borderRadius:"10px",fontSize:"14px",color:"#1a1a1a",outline:"none",boxSizing:"border-box",marginBottom:"16px"}});
  modal.appendChild(inp);

  const btns=h("div",{style:{display:"flex",gap:"10px"}});

  const btnCancelar=h("button",{style:{flex:"1",padding:"11px",background:"#f0f0f0",border:"none",borderRadius:"10px",color:"#333",fontWeight:"700",fontSize:"14px",cursor:"pointer"},
    onClick:()=>document.body.removeChild(overlay)},"Cancelar");

  const btnConfirmar=h("button",{style:{flex:"1",padding:"11px",background:"#f44336",border:"none",borderRadius:"10px",color:"#fff",fontWeight:"700",fontSize:"14px",cursor:"pointer"},
    onClick:async()=>{
      if(inp.value.trim().toUpperCase()!=="CONFIRMAR"){
        inp.style.borderColor="#f44336";
        inp.style.background="#fff5f5";
        inp.placeholder="Digite exatamente: CONFIRMAR";
        return;
      }
      document.body.removeChild(overlay);
      await zerarBD();
    }},"🗑️ Zerar Tudo");

  btns.appendChild(btnCancelar);
  btns.appendChild(btnConfirmar);
  modal.appendChild(btns);
  overlay.appendChild(modal);

  // fechar clicando fora
  overlay.addEventListener("click",e=>{if(e.target===overlay)document.body.removeChild(overlay);});
  document.body.appendChild(overlay);
  setTimeout(()=>inp.focus(),100);
}

async function zerarBD(){
  showToast("⏳ Zerando banco de dados...");
  try{
    // deletar tudo das 3 tabelas
    const [r1,r2,r3]=await Promise.all([
      db.from("producoes").delete().gte("id",0),
      db.from("feed").delete().gte("id",0),
      db.from("planos").delete().gte("id",0),
    ]);
    const erros=[r1.error,r2.error,r3.error].filter(Boolean);
    if(erros.length){
      console.error("Erros ao zerar:",erros);
      showToast("❌ Erro ao zerar alguns dados. Verifique o console.");
      return;
    }
    // limpar estado local
    setState({
      producoes:{},
      feed:[],
      planos:[],
      hist:[],
      histCarregado:true,
      setorAtivo:null,
      aba:"dashboard",
    });
    showToast("✅ Banco de dados zerado com sucesso!");
  }catch(e){
    console.error(e);
    showToast("❌ Erro inesperado ao zerar o BD.");
  }
}

// ══════════════════════════════════════════
//  GARGALOS
// ══════════════════════════════════════════
function calcGargalos(){
  const alertas=[];
  SETORES.forEach(setor=>{
    const d=state.producoes[setor.id];
    const meta=state.metas[setor.id]||0;
    if(!d){
      alertas.push({setor,tipo:"sem_registro",nivel:"critico",msg:"Sem registro de produção hoje"});
      return;
    }
    const perdaPct=calcPerdaSetor(setor.id,d);
    if(perdaPct!==null && perdaPct>5){
      alertas.push({setor,tipo:"perda_alta",nivel:perdaPct>10?"critico":"atencao",msg:`Perda de ${perdaPct.toFixed(1)}% ${perdaPct>10?"— Crítico":"— Atenção"}`,valor:perdaPct});
    }
    if(meta>0){
      const prod=calcProducaoSetor(setor.id,d);
      const pct=(prod/meta)*100;
      if(pct<100){
        alertas.push({setor,tipo:"abaixo_meta",nivel:pct<50?"critico":"atencao",msg:`${prod} de ${meta} peças (${pct.toFixed(0)}% da meta)`,valor:pct});
      }
    }
  });
  return alertas;
}

function calcPerdaSetor(id,d){
  if(id==="tratamento") return Number(d.pecasTratadas)>0?((Number(d.pecasPerdidas||0)/Number(d.pecasTratadas))*100):null;
  if(id==="inspecao"){
    const tot=Number(d.pecasInspecMontagens||0)+Number(d.pecasInspecSemi||0);
    return tot>0?(((Number(d.perdasInspecMontagens||0)+Number(d.perdasInspecSemi||0))/tot)*100):null;
  }
  if(id==="posbanho"||id==="preelos"){
    const rev=Number(d.pecasRevOuro||0)+Number(d.pecasRevRodio||0);
    return rev>0?(((Number(d.sucatasOuroQuant||0)+Number(d.sucatasRodioQuant||0))/rev)*100):null;
  }
  if(id==="etiquetagem"){
    const tot=Number(d.tagsEtiquetadas||0)+Number(d.tagsParaEtiquetar||0);
    return tot>0?((Number(d.sucatasQuant||0)/tot)*100):null;
  }
  if(d.pesoBruto&&d.perda) return ((Number(d.perda)/Number(d.pesoBruto))*100);
  return null;
}

function calcProducaoSetor(id,d){
  if(!d) return 0;
  if(id==="cadastros") return Number(d.skusGeradas||0)+Number(d.opsGeradas||0);
  if(id==="almoxarifado") return Number(d.separacao||0);
  if(id==="etiquetagem") return Number(d.tagsEtiquetadas||0);
  if(id==="tratamento") return Number(d.pecasTratadas||0);
  if(id==="inspecao") return Number(d.pecasInspecMontagens||0)+Number(d.pecasInspecSemi||0);
  if(id==="preelos") return Number(d.pecasAmarracaoExt||0)+Number(d.pecasAmarracaoInt||0);
  if(id==="posbanho") return Number(d.pecasRevOuro||0)+Number(d.pecasRevRodio||0);
  if(id==="galvanoplastia") return Number(d.pecasBanhadasOuro||0)+Number(d.pecasBanhadasRodio||0);
  if(id==="colagem") return Number(d.seriaisGerados||0);
  if(id==="fundicao") return Number(d.injetadasCera||0);
  return Number(d.pecasProduzidas||0);
}

function renderGargalos(){
  const pg=h("div",{style:{padding:"16px",maxWidth:"1100px",margin:"0 auto"}});
  const alertas=calcGargalos();
  const criticos=alertas.filter(a=>a.nivel==="critico");
  const atencao=alertas.filter(a=>a.nivel==="atencao");
  const ok=SETORES.filter(s=>!alertas.find(a=>a.setor.id===s.id));

  // título + botão metas
  const topRow=h("div",{style:{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:"20px",flexWrap:"wrap",gap:"8px"}});
  const titDiv=h("div",{});
  titDiv.appendChild(h("h2",{style:{color:"#1a1a1a",margin:"0 0 4px",fontSize:"22px"}},"🚨 Identificação de Gargalos"));
  titDiv.appendChild(h("p",{style:{color:"#666",margin:"0",fontSize:"13px"}},hoje));
  topRow.appendChild(titDiv);
  const btnMeta=h("button",{style:{padding:"8px 18px",background:"#43a047",border:"none",borderRadius:"10px",color:"#fff",fontWeight:"700",fontSize:"13px",cursor:"pointer"},
    onClick:()=>setState({editandoMetas:!state.editandoMetas})},state.editandoMetas?"✅ Fechar Metas":"⚙️ Configurar Metas");
  topRow.appendChild(btnMeta);
  pg.appendChild(topRow);

  // painel de configuração de metas
  if(state.editandoMetas){
    const metaBox=h("div",{style:{background:"#fff",border:"2px solid #43a047",borderRadius:"16px",padding:"20px",marginBottom:"20px"}});
    metaBox.appendChild(h("h3",{style:{color:"#43a047",margin:"0 0 4px",fontSize:"15px"}},"⚙️ Metas Diárias por Setor"));
    metaBox.appendChild(h("p",{style:{color:"#888",fontSize:"12px",margin:"0 0 16px"}},"Defina a meta de peças/dia por setor. 0 = sem meta configurada."));
    const mg=h("div",{style:{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(200px,1fr))",gap:"10px"}});
    SETORES.forEach(setor=>{
      const wr=h("div",{});
      wr.appendChild(h("label",{style:{fontSize:"11px",color:"#555",textTransform:"uppercase",letterSpacing:"0.5px",display:"block",marginBottom:"4px"}},`${setor.icon} ${setor.nome}`));
      const inp=h("input",{type:"number",min:"0",placeholder:"0 = sem meta",
        style:{width:"100%",padding:"8px 10px",border:`1px solid ${setor.cor}60`,borderRadius:"8px",fontSize:"13px",color:"#1a1a1a",background:"#fafafa",outline:"none",boxSizing:"border-box"},
        onInput:e=>{const m={...state.metas};m[setor.id]=Number(e.target.value)||0;setState({metas:m});}});
      inp.value=state.metas[setor.id]||"";
      wr.appendChild(inp);
      mg.appendChild(wr);
    });
    metaBox.appendChild(mg);
    pg.appendChild(metaBox);
  }

  // cards resumo
  const resumo=h("div",{style:{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:"12px",marginBottom:"24px"}});
  [{label:"Críticos",val:criticos.length,cor:"#f44336",bg:"#fff5f5",icon:"🔴"},
   {label:"Atenção",val:atencao.length,cor:"#ff9800",bg:"#fff8f0",icon:"🟡"},
   {label:"OK",val:ok.length,cor:"#43a047",bg:"#f0f7f0",icon:"🟢"}].forEach(r=>{
    const c=h("div",{style:{background:r.bg,border:`2px solid ${r.cor}40`,borderRadius:"14px",padding:"16px 12px",textAlign:"center"}});
    c.appendChild(h("div",{style:{fontSize:"30px",fontWeight:"800",color:r.cor}},String(r.val)));
    c.appendChild(h("div",{style:{fontSize:"12px",color:"#555",marginTop:"4px"}}),`${r.icon} ${r.label}`);
    resumo.appendChild(c);
  });
  pg.appendChild(resumo);

  // críticos
  if(criticos.length){
    pg.appendChild(h("h3",{style:{color:"#f44336",margin:"0 0 10px",fontSize:"15px"}},"🔴 Críticos — Ação Imediata"));
    const g=h("div",{style:{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(300px,1fr))",gap:"10px",marginBottom:"24px"}});
    criticos.forEach(a=>g.appendChild(alertCard(a)));
    pg.appendChild(g);
  }

  // atenção
  if(atencao.length){
    pg.appendChild(h("h3",{style:{color:"#ff9800",margin:"0 0 10px",fontSize:"15px"}},"🟡 Atenção — Monitorar"));
    const g=h("div",{style:{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(300px,1fr))",gap:"10px",marginBottom:"24px"}});
    atencao.forEach(a=>g.appendChild(alertCard(a)));
    pg.appendChild(g);
  }

  // ok
  if(ok.length){
    pg.appendChild(h("h3",{style:{color:"#43a047",margin:"0 0 10px",fontSize:"15px"}},"🟢 Setores sem Gargalo"));
    const g=h("div",{style:{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(220px,1fr))",gap:"8px",marginBottom:"20px"}});
    ok.forEach(setor=>{
      const c=h("div",{style:{background:"#f0f7f0",border:"1px solid #c8e6c9",borderRadius:"12px",padding:"12px",display:"flex",alignItems:"center",gap:"10px"}});
      c.appendChild(h("span",{style:{fontSize:"26px"}},setor.icon));
      const info=h("div",{});
      info.appendChild(h("div",{style:{fontWeight:"700",color:"#1a1a1a",fontSize:"13px"}},setor.nome));
      const prod=calcProducaoSetor(setor.id,state.producoes[setor.id]);
      const meta=state.metas[setor.id]||0;
      info.appendChild(h("div",{style:{color:"#43a047",fontSize:"12px",marginTop:"2px"}},meta>0?`${prod} / ${meta} peças ✅`:`${prod} peças registradas ✅`));
      c.appendChild(info);
      g.appendChild(c);
    });
    pg.appendChild(g);
  }

  return pg;
}

function alertCard(a){
  const cor=a.nivel==="critico"?"#f44336":"#ff9800";
  const bg=a.nivel==="critico"?"#fff5f5":"#fff8f0";
  const c=h("div",{style:{background:bg,border:`2px solid ${cor}50`,borderRadius:"14px",padding:"16px",cursor:"pointer"},className:"card-hover"});
  c.addEventListener("click",()=>setState({aba:"setores",setorAtivo:a.setor.id,form:{...(state.producoes[a.setor.id]||{})}}));
  const top=h("div",{style:{display:"flex",alignItems:"center",gap:"10px",marginBottom:"10px"}});
  top.appendChild(h("span",{style:{fontSize:"28px"}},a.setor.icon));
  const info=h("div",{style:{flex:"1"}});
  info.appendChild(h("div",{style:{fontWeight:"700",color:"#1a1a1a",fontSize:"14px"}},a.setor.nome));
  info.appendChild(h("div",{style:{color:cor,fontSize:"12px",fontWeight:"600",marginTop:"2px"}},
    a.tipo==="sem_registro"?"🔴 Sem registro hoje":a.tipo==="perda_alta"?"📉 Perda elevada":"📊 Abaixo da meta"
  ));
  top.appendChild(info);
  top.appendChild(h("span",{style:{background:cor,color:"#fff",borderRadius:"8px",padding:"3px 10px",fontSize:"11px",fontWeight:"700",alignSelf:"flex-start"}},
    a.nivel==="critico"?"CRÍTICO":"ATENÇÃO"
  ));
  c.appendChild(top);
  c.appendChild(h("div",{style:{color:"#444",fontSize:"13px",background:"rgba(0,0,0,0.04)",borderRadius:"8px",padding:"8px 10px"}},a.msg));
  if(a.tipo==="abaixo_meta"&&a.valor!==undefined){
    const barWrap=h("div",{style:{marginTop:"10px",background:"#e0e0e0",borderRadius:"4px",height:"7px",overflow:"hidden"}});
    barWrap.appendChild(h("div",{style:{width:`${Math.min(a.valor,100)}%`,height:"100%",background:a.valor<50?"#f44336":"#ff9800",borderRadius:"4px"}}));
    c.appendChild(barWrap);
    c.appendChild(h("div",{style:{color:"#888",fontSize:"11px",marginTop:"3px",textAlign:"right"}},`${a.valor.toFixed(0)}% da meta`));
  }
  c.appendChild(h("div",{style:{marginTop:"10px",color:"#888",fontSize:"11px"}},"👆 Clique para abrir e corrigir"));
  return c;
}




render();
</script>
